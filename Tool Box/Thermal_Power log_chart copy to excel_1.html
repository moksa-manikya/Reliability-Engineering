<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Power_log 動態批次圖表生成與回存</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 引入 ExcelJS 用於處理帶有圖片的 Excel 讀寫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 sm:p-8 flex flex-col items-center">

    <div class="w-full max-w-6xl space-y-6">
        <!-- 頂部全域控制面板 -->
        <div class="bg-white p-6 rounded-2xl shadow-xl">
            <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">📊 Power_log 批次圖表生成與 Excel 回存</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- 檔案上傳與導出 -->
                <div class="flex flex-col justify-between border-r md:border-gray-200 pr-0 md:pr-4 space-y-3">
                    <div>
                        <label class="block font-medium text-blue-700 mb-2 text-sm">1. 匯入 Excel 檔案 (.xlsx)：</label>
                        <input type="file" id="excelFileInput" accept=".xlsx" 
                               class="w-full text-xs text-gray-500 file:mr-2 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                    </div>
                    
                    <!-- 匯出包含圖表的 Excel -->
                    <div>
                        <button id="exportBtn" onclick="exportExcelWithCharts()" disabled
                                class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-gray-300 text-white font-medium py-2 rounded-lg transition text-xs shadow flex items-center justify-center gap-1">
                            📥 下載包含圖表的 Excel (.xlsx)
                        </button>
                    </div>
                </div>

                <!-- 預設軸名稱設定 -->
                <div class="space-y-2 border-r md:border-gray-200 pr-0 md:pr-4">
                    <span class="block font-medium text-blue-700 text-sm">2. 預設軸標題：</span>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label for="xAxisTitleInput" class="block text-xs font-medium text-gray-600">X 軸預設：</label>
                            <input type="text" id="xAxisTitleInput" value="Time" class="w-full border rounded px-2 py-1 text-xs bg-gray-50">
                        </div>
                        <div>
                            <label for="yAxisTitleInput" class="block text-xs font-medium text-gray-600">Y 軸預設：</label>
                            <input type="text" id="yAxisTitleInput" value="Power Value (vW)" class="w-full border rounded px-2 py-1 text-xs bg-gray-50">
                        </div>
                    </div>
                </div>

                <!-- 統一設定 Y 軸範圍 -->
                <div class="space-y-2">
                    <span class="block font-medium text-blue-700 text-sm">3. 統一調整所有 Y 軸範圍：</span>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label for="globalYMin" class="block text-xs font-medium text-gray-600">統一 Y 最小值：</label>
                            <input type="number" step="any" id="globalYMin" placeholder="自動" class="w-full border rounded px-2 py-1 text-xs">
                        </div>
                        <div>
                            <label for="globalYMax" class="block text-xs font-medium text-gray-600">統一 Y 最大值：</label>
                            <input type="number" step="any" id="globalYMax" placeholder="自動" class="w-full border rounded px-2 py-1 text-xs">
                        </div>
                    </div>
                    <button onclick="applyGlobalYLimits()" 
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-1.5 rounded-lg transition text-xs shadow-sm mt-1">
                        套用 Y 軸範圍至所有圖表
                    </button>
                </div>
            </div>
        </div>

        <!-- 所有 Sheet 圖表呈現區域 -->
        <div id="chartsContainer" class="space-y-6">
            <div class="bg-white p-8 rounded-2xl shadow-md text-center text-gray-400">
                請先上傳 Excel 檔案以生成所有 Sheet 的分析圖表。
            </div>
        </div>
    </div>

    <script>
        let workbookBuffer = null; 
        let rawWorkbookData = [];  
        let chartInstances = [];   
        let fileName = 'updated_power_log.xlsx';

        // 預設 Hex 顏色庫
        const colorPaletteHex = [
            '#3b82f6',  // 藍色
            '#f97316',  // 橘色
            '#22c55e',  // 綠色
            '#a855f7',  // 紫色
            '#ec4899',  // 粉紅
            '#00FFFF',  // 亮藍
            '#eab308',  // 黃色
            '#ef4444',  // 紅色
            '#6366f1'   // 靛藍
        ];

        // 預設圖示形狀庫
        const shapePalette = ['circle', 'triangle', 'rect', 'rectRot', 'cross'];

        // 輔助繪製圖示形狀（尺寸設定較為精細）
        function drawMarkerShape(ctx, shape, x, y, size, color) {
            ctx.save();
            ctx.fillStyle = color;
            ctx.strokeStyle = color;
            ctx.beginPath();
            
            if (shape === 'triangle') {
                ctx.moveTo(x, y - size);
                ctx.lineTo(x - size, y + size);
                ctx.lineTo(x + size, y + size);
                ctx.closePath();
                ctx.fill();
            } else if (shape === 'rect') {
                ctx.fillRect(x - size, y - size, size * 2, size * 2);
            } else if (shape === 'rectRot') {
                ctx.moveTo(x, y - size);
                ctx.lineTo(x + size, y);
                ctx.lineTo(x, y + size);
                ctx.lineTo(x - size, y);
                ctx.closePath();
                ctx.fill();
            } else if (shape === 'cross') {
                ctx.lineWidth = 1;
                ctx.moveTo(x - size, y);
                ctx.lineTo(x + size, y);
                ctx.moveTo(x, y - size);
                ctx.lineTo(x, y + size);
                ctx.stroke();
            } else { // circle
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        // 強制 Canvas 填滿白色背景
        const whiteBackgroundPlugin = {
            id: 'customCanvasBackgroundColor',
            beforeDraw: (chart) => {
                const { ctx } = chart;
                ctx.save();
                ctx.globalCompositeOperation = 'destination-over';
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, chart.width, chart.height);
                ctx.restore();
            }
        };

        document.getElementById('excelFileInput').addEventListener('change', handleFileUpload);

        function parseExcelTimeValue(val) {
            if (val === null || val === undefined) return '';
            
            if (val instanceof Date) {
                const hh = String(val.getUTCHours()).padStart(2, '0');
                const mm = String(val.getUTCMinutes()).padStart(2, '0');
                const ss = String(val.getUTCSeconds()).padStart(2, '0');
                return `${hh}:${mm}:${ss}`;
            }
            
            if (typeof val === 'number' && val < 1 && val > 0) {
                const totalSeconds = Math.round(val * 86400);
                const hh = String(Math.floor(totalSeconds / 3600) % 24).padStart(2, '0');
                const mm = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
                const ss = String(totalSeconds % 60).padStart(2, '0');
                return `${hh}:${mm}:${ss}`;
            }

            if (typeof val === 'object') {
                if (val.text) return String(val.text).trim();
                if (val.result) val = val.result;
            }

            let strVal = String(val).trim();

            if (strVal.includes('GMT') || strVal.includes('T') || strVal.includes('-') || strVal.includes('/')) {
                const dateObj = new Date(strVal);
                if (!isNaN(dateObj.getTime())) {
                    const hh = String(dateObj.getUTCHours()).padStart(2, '0');
                    const mm = String(dateObj.getUTCMinutes()).padStart(2, '0');
                    const ss = String(dateObj.getUTCSeconds()).padStart(2, '0');
                    return `${hh}:${mm}:${ss}`;
                }
            }

            return strVal;
        }

        async function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            fileName = file.name;
            const reader = new FileReader();

            reader.onload = async function (event) {
                workbookBuffer = event.target.result;
                const wb = new ExcelJS.Workbook();
                await wb.xlsx.load(workbookBuffer);

                destroyAllCharts();
                const container = document.getElementById('chartsContainer');
                container.innerHTML = '';
                rawWorkbookData = [];

                wb.eachSheet((worksheet, sheetId) => {
                    const sheetName = worksheet.name;
                    const rows = [];
                    
                    worksheet.eachRow({ includeEmpty: false }, (row) => {
                        const rowValues = [];
                        row.eachCell({ includeEmpty: true }, (cell, colNumber) => {
                            rowValues[colNumber - 1] = cell.value;
                        });
                        rows.push(rowValues);
                    });

                    rawWorkbookData.push({ sheetName, rows });
                });

                rawWorkbookData.forEach((data, index) => {
                    createSheetChartCard(data.sheetName, index);
                });

                document.getElementById('exportBtn').disabled = false;
            };

            reader.readAsArrayBuffer(file);
        }

        function destroyAllCharts() {
            chartInstances.forEach(item => {
                if (item.chart) item.chart.destroy();
            });
            chartInstances = [];
        }

        function createSheetChartCard(sheetName, index) {
            const sheetData = rawWorkbookData.find(d => d.sheetName === sheetName);
            if (!sheetData || !sheetData.rows || sheetData.rows.length < 2) return;

            const rows = sheetData.rows;
            const headerCols = rows[0] || [];
            
            const maxCols = Math.max(...rows.map(r => r ? r.length : 0));
            const runCount = Math.max(1, Math.floor(maxCols / 2));

            const container = document.getElementById('chartsContainer');
            const card = document.createElement('div');
            card.className = "bg-white p-6 rounded-2xl shadow-lg flex flex-col md:flex-row gap-6 border border-gray-100";
            card.id = `sheet-card-${index}`;

            const globalMin = document.getElementById('globalYMin').value;
            const globalMax = document.getElementById('globalYMax').value;
            const defaultXTitle = document.getElementById('xAxisTitleInput').value.trim() || 'Time';
            const defaultYTitle = document.getElementById('yAxisTitleInput').value.trim() || 'Power Value (vW)';
            const defaultChartTitle = `${sheetName} Power (vW)`;

            let runsInputsHtml = '';
            for (let r = 0; r < runCount; r++) {
                const defaultColor = colorPaletteHex[r % colorPaletteHex.length];
                const defaultShape = shapePalette[r % shapePalette.length];

                runsInputsHtml += `
                    <div class="p-2 border border-gray-200 rounded-lg bg-white space-y-1.5">
                        <div class="flex items-center gap-2">
                            <input type="text" id="run_${index}_${r}" placeholder="測試 ${r + 1}" class="w-1/2 border rounded px-2 py-1 text-xs">
                            <input type="text" id="time_${index}_${r}" placeholder="時間 ${r + 1}" class="w-1/2 border rounded px-2 py-1 text-center text-xs">
                        </div>
                        <div class="flex items-center justify-between gap-2 pt-0.5">
                            <div class="flex items-center gap-1">
                                <label class="text-gray-500 text-[11px]">圖示:</label>
                                <select id="shape_${index}_${r}" class="border rounded px-1 py-0.5 text-xs bg-gray-50">
                                    <option value="circle" ${defaultShape === 'circle' ? 'selected' : ''}>● 圓形</option>
                                    <option value="triangle" ${defaultShape === 'triangle' ? 'selected' : ''}>▲ 三角</option>
                                    <option value="rect" ${defaultShape === 'rect' ? 'selected' : ''}>■ 正方</option>
                                    <option value="rectRot" ${defaultShape === 'rectRot' ? 'selected' : ''}>◆ 菱形</option>
                                    <option value="cross" ${defaultShape === 'cross' ? 'selected' : ''}>┼ 十字</option>
                                </select>
                            </div>
                            <div class="flex items-center gap-1">
                                <label class="text-gray-500 text-[11px]">顏色:</label>
                                <input type="color" id="color_${index}_${r}" value="${defaultColor}" class="w-7 h-6 p-0 border rounded cursor-pointer">
                            </div>
                        </div>
                    </div>
                `;
            }

            card.innerHTML = `
                <!-- 左側控制面板 -->
                <div class="w-full md:w-1/3 flex flex-col gap-3 bg-gray-50 p-4 rounded-xl border border-gray-200 text-xs">
                    <div class="font-bold text-sm text-gray-800 border-b border-gray-200 pb-2 flex justify-between items-center">
                        <span>Sheet: ${sheetName}</span>
                        <span class="text-xs font-normal text-blue-600 bg-blue-50 px-2 py-0.5 rounded">${runCount} 組數據</span>
                    </div>

                    <!-- 標題與軸名稱設定 -->
                    <div class="space-y-1.5 border-b border-gray-200 pb-2">
                        <div class="font-medium text-gray-700">獨立標題與軸名稱設定：</div>
                        <div>
                            <label class="text-gray-500 block">圖表標題 (Title)：</label>
                            <input type="text" id="chartTitle_${index}" value="${defaultChartTitle}" class="w-full border rounded px-2 py-1 bg-white">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-gray-500 block">X 軸標題：</label>
                                <input type="text" id="xTitle_${index}" value="${defaultXTitle}" class="w-full border rounded px-2 py-1 bg-white">
                            </div>
                            <div>
                                <label class="text-gray-500 block">Y 軸標題：</label>
                                <input type="text" id="yTitle_${index}" value="${defaultYTitle}" class="w-full border rounded px-2 py-1 bg-white">
                            </div>
                        </div>
                    </div>

                    <!-- 動態生成測試項目設定 -->
                    <div class="space-y-1.5 border-b border-gray-200 pb-2">
                        <div class="font-medium text-gray-600">測試項目樣式設定：</div>
                        <div class="max-h-52 overflow-y-auto space-y-2 pr-1">
                            ${runsInputsHtml}
                        </div>
                    </div>

                    <!-- 個別 Y 軸與平均線設定 -->
                    <div class="space-y-1.5">
                        <div class="font-medium text-gray-700">Y 軸與平均線設定：</div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-gray-500 block">Y 最小值：</label>
                                <input type="number" step="any" id="yMin_${index}" value="${globalMin}" placeholder="自動" class="w-full border rounded px-2 py-1 bg-white">
                            </div>
                            <div>
                                <label class="text-gray-500 block">Y 最大值：</label>
                                <input type="number" step="any" id="yMax_${index}" value="${globalMax}" placeholder="自動" class="w-full border rounded px-2 py-1 bg-white">
                            </div>
                        </div>
                        <div class="flex items-center gap-2 pt-1">
                            <input type="checkbox" id="showAvg_${index}" checked class="rounded text-blue-600 border-gray-300 focus:ring-blue-500">
                            <label for="showAvg_${index}" class="text-xs text-gray-700 font-medium cursor-pointer">顯示平均線 (Average Line)</label>
                        </div>
                    </div>

                    <button onclick="drawSingleSheetChart('${sheetName}', ${index})" 
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-1.5 rounded transition mt-2">
                        更新此圖表
                    </button>
                </div>

                <!-- 右側圖表畫布 -->
                <div class="w-full md:w-2/3 flex flex-col">
                    <div class="border border-gray-200 rounded-xl p-4 bg-white relative flex flex-col">
                        <div class="h-[380px] relative min-h-0">
                            <canvas id="canvas_${index}"></canvas>
                        </div>
                        <!-- 自訂靠左對齊、分行的 Legend 容器 -->
                        <div id="legend_${index}" class="mt-4 pt-3 border-t border-gray-100 flex flex-wrap gap-x-6 gap-y-2 text-xs font-medium text-gray-700"></div>
                    </div>
                </div>
            `;

            container.appendChild(card);
            drawSingleSheetChart(sheetName, index);
        }

        function drawSingleSheetChart(sheetName, index) {
            const sheetData = rawWorkbookData.find(d => d.sheetName === sheetName);
            if (!sheetData) return;
            const rows = sheetData.rows;
            if (!rows || rows.length < 2) return;

            const headerCols = rows[0] || [];
            const firstDataCols = rows[1] || [];

            const maxCols = Math.max(...rows.map(r => r ? r.length : 0));
            const runCount = Math.max(1, Math.floor(maxCols / 2));

            const datasetsData = Array.from({ length: runCount }, () => []);

            for (let r = 0; r < runCount; r++) {
                const runInput = document.getElementById(`run_${index}_${r}`);
                const timeInput = document.getElementById(`time_${index}_${r}`);
                const nameColIdx = r * 2 + 1;
                const timeColIdx = r * 2;

                if (runInput && !runInput.value) {
                    runInput.value = headerCols[nameColIdx] ? String(headerCols[nameColIdx]).trim() : `測試 ${r + 1}`;
                }
                if (timeInput && !timeInput.value) {
                    timeInput.value = parseExcelTimeValue(firstDataCols[timeColIdx]);
                }
            }

            for (let i = 1; i < rows.length; i++) {
                const columns = rows[i];
                if (!columns || columns.length === 0) continue;

                for (let r = 0; r < runCount; r++) {
                    const valIdx = r * 2 + 1;
                    if (columns.length > valIdx) {
                        const val = parseFloat(columns[valIdx]);
                        if (!isNaN(val)) {
                            datasetsData[r].push({ x: datasetsData[r].length + 1, y: val });
                        }
                    }
                }
            }

            const chartDatasets = [];
            const showAvg = document.getElementById(`showAvg_${index}`).checked;

            for (let r = 0; r < runCount; r++) {
                const runName = document.getElementById(`run_${index}_${r}`).value.trim() || `測試 ${r + 1}`;
                const runTime = document.getElementById(`time_${index}_${r}`).value.trim();
                const shape = document.getElementById(`shape_${index}_${r}`) ? document.getElementById(`shape_${index}_${r}`).value : shapePalette[r % shapePalette.length];
                const color = document.getElementById(`color_${index}_${r}`) ? document.getElementById(`color_${index}_${r}`).value : colorPaletteHex[r % colorPaletteHex.length];

                const dataset = datasetsData[r];
                const calcAvg = dataset.length > 0 ? (dataset.reduce((sum, d) => sum + d.y, 0) / dataset.length) : null;
                const label = runName + (runTime ? ` (${runTime})` : '');

                chartDatasets.push({
                    label: label,
                    data: dataset,
                    borderColor: color,
                    backgroundColor: color,
                    borderWidth: 2,
                    pointStyle: shape,
                    pointRadius: 2,       // 調小數據點尺寸 (原本為 4)
                    pointHoverRadius: 4,    // 滑鼠懸停時的大小
                    avgValue: calcAvg,
                    runIndex: r
                });
            }

            if (showAvg) {
                for (let r = 0; r < runCount; r++) {
                    const mainDataset = chartDatasets[r];
                    const avg = mainDataset.avgValue;
                    const len = mainDataset.data.length;

                    if (avg !== null && len > 0) {
                        chartDatasets.push({
                            label: `${mainDataset.label} Avg Line`,
                            data: [{ x: 1, y: avg }, { x: len, y: avg }],
                            borderColor: mainDataset.borderColor,
                            borderWidth: 1.5,
                            borderDash: [5, 5],
                            pointRadius: 0,
                            isAvgLine: true,
                            parentIndex: r
                        });
                    }
                }
            }

            const chartTitle = document.getElementById(`chartTitle_${index}`).value.trim();
            const xAxisTitle = document.getElementById(`xTitle_${index}`).value.trim() || 'Time';
            const yAxisTitle = document.getElementById(`yAxisTitleInput`).value.trim() || 'Power Value (vW)';

            const yMin = document.getElementById(`yMin_${index}`).value;
            const yMax = document.getElementById(`yMax_${index}`).value;

            const yScaleConfig = { title: { display: true, text: yAxisTitle } };
            if (yMin !== '') yScaleConfig.min = parseFloat(yMin);
            if (yMax !== '') yScaleConfig.max = parseFloat(yMax);

            const existingIndex = chartInstances.findIndex(item => item.index === index);
            if (existingIndex !== -1) {
                chartInstances[existingIndex].chart.destroy();
                chartInstances.splice(existingIndex, 1);
            }

            const ctx = document.getElementById(`canvas_${index}`).getContext('2d');
            const newChart = new Chart(ctx, {
                type: 'line',
                data: { datasets: chartDatasets },
                plugins: [whiteBackgroundPlugin],
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    plugins: {
                        title: { display: true, text: chartTitle, font: { size: 14 } },
                        legend: { display: false }
                    },
                    scales: {
                        x: { 
                            type: 'linear',
                            title: { display: true, text: xAxisTitle },
                            ticks: { stepSize: 1 }
                        },
                        y: yScaleConfig
                    }
                }
            });

            chartInstances.push({ index, sheetName, chart: newChart, canvasId: `canvas_${index}`, runCount });

            renderCustomLeftAlignedLegend(newChart, `legend_${index}`, runCount);
        }

        function renderCustomLeftAlignedLegend(chart, containerId, runCount) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';

            chart.data.datasets.forEach((dataset, idx) => {
                if (dataset.isAvgLine) return;

                const isVisible = chart.isDatasetVisible(idx);

                const itemBox = document.createElement('div');
                itemBox.className = `flex items-start gap-2 cursor-pointer transition-opacity duration-200 ${isVisible ? 'opacity-100' : 'opacity-30 line-through'}`;
                
                itemBox.onclick = () => {
                    const nextVisible = !chart.isDatasetVisible(idx);
                    chart.setDatasetVisibility(idx, nextVisible);

                    const avgLineIdx = chart.data.datasets.findIndex(ds => ds.isAvgLine && ds.parentIndex === idx);
                    if (avgLineIdx !== -1) {
                        chart.setDatasetVisibility(avgLineIdx, nextVisible);
                    }

                    chart.update();
                    renderCustomLeftAlignedLegend(chart, containerId, runCount);
                };

                const legendCanvas = document.createElement('canvas');
                legendCanvas.width = 14;
                legendCanvas.height = 14;
                legendCanvas.className = 'mt-0.5 flex-shrink-0';
                const lctx = legendCanvas.getContext('2d');
                drawMarkerShape(lctx, dataset.pointStyle || 'circle', 7, 7, 3.5, dataset.borderColor);

                const textGroup = document.createElement('div');
                textGroup.className = 'flex flex-col text-left leading-tight';

                const titleLabel = document.createElement('span');
                titleLabel.className = 'font-semibold text-gray-800';
                titleLabel.innerText = dataset.label;

                const avgLabel = document.createElement('span');
                avgLabel.className = 'text-xs font-bold text-gray-500 mt-0.5';
                avgLabel.innerText = dataset.avgValue !== null ? `Avg: ${dataset.avgValue.toFixed(2)}` : 'Avg: N/A';

                textGroup.appendChild(titleLabel);
                textGroup.appendChild(avgLabel);

                itemBox.appendChild(legendCanvas);
                itemBox.appendChild(textGroup);

                container.appendChild(itemBox);
            });
        }

        function applyGlobalYLimits() {
            const globalMin = document.getElementById('globalYMin').value;
            const globalMax = document.getElementById('globalYMax').value;

            rawWorkbookData.forEach((data, index) => {
                const yMinInput = document.getElementById(`yMin_${index}`);
                const yMaxInput = document.getElementById(`yMax_${index}`);

                if (yMinInput) yMinInput.value = globalMin;
                if (yMaxInput) yMaxInput.value = globalMax;

                drawSingleSheetChart(data.sheetName, index);
            });
        }

        async function exportExcelWithCharts() {
            if (!workbookBuffer) return;

            const exportBtn = document.getElementById('exportBtn');
            exportBtn.innerText = '⏳ 正在包裝圖表匯出中...';
            exportBtn.disabled = true;

            const wb = new ExcelJS.Workbook();
            await wb.xlsx.load(workbookBuffer);

            chartInstances.forEach(item => {
                const worksheet = wb.getWorksheet(item.sheetName);
                if (!worksheet) return;

                const canvas = document.getElementById(item.canvasId);
                if (!canvas) return;

                const runCount = item.runCount || 1;
                const rowsOfLegend = Math.ceil(runCount / 3);
                const extraHeight = 50 + (rowsOfLegend * 35);

                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = canvas.width;
                exportCanvas.height = canvas.height + extraHeight;

                const ctx = exportCanvas.getContext('2d');
                
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

                ctx.drawImage(canvas, 0, 0);

                const chart = item.chart;
                let startX = 50;
                let startY = canvas.height + 25;
                let colCount = 0;

                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'left';

                chart.data.datasets.forEach((ds) => {
                    if (ds.isAvgLine) return;

                    drawMarkerShape(ctx, ds.pointStyle || 'circle', startX, startY - 4, 3.5, ds.borderColor);

                    ctx.fillStyle = '#333333';
                    ctx.fillText(ds.label, startX + 12, startY);

                    ctx.fillStyle = '#666666';
                    const avgStr = ds.avgValue !== null ? `Avg: ${ds.avgValue.toFixed(2)}` : 'Avg: N/A';
                    ctx.fillText(avgStr, startX + 12, startY + 16);

                    startX += 220;
                    colCount++;

                    if (colCount % 3 === 0) {
                        startX = 50;
                        startY += 40;
                    }
                });

                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                ctx.strokeRect(1, 1, exportCanvas.width - 2, exportCanvas.height - 2);

                const imageBase64 = exportCanvas.toDataURL('image/png');
                const imageId = wb.addImage({
                    base64: imageBase64,
                    extension: 'png',
                });

                let maxColNumber = 1;
                worksheet.eachRow({ includeEmpty: false }, (row) => {
                    if (row.actualCellCount > maxColNumber) {
                        maxColNumber = row.actualCellCount;
                    }
                });

                const insertCol = maxColNumber + 2; 

                worksheet.addImage(imageId, {
                    tl: { col: insertCol, row: 1 }, 
                    ext: { width: 720, height: 380 + (extraHeight * 0.8) }
                });
            });

            const buffer = await wb.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `[Chart]_` + fileName;
            link.click();
            URL.revokeObjectURL(link.href);

            exportBtn.innerText = '📥 下載包含圖表的 Excel (.xlsx)';
            exportBtn.disabled = false;
        }
    </script>
</body>
</html>

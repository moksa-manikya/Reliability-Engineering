<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Log 整合與圖表繪製一體化工具</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- ExcelJS CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        .upload-area {
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 24px 20px;
            text-align: center;
            background-color: #f1f5f9;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary);
            background-color: #eff6ff;
        }

        .section-box {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 16px;
            background: #fafafa;
        }

        .file-list {
            max-height: 180px;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 0.88rem;
            border-bottom: 1px solid #f1f5f9;
            gap: 12px;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .tag-input {
            padding: 3px 6px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.82rem;
            width: 120px;
            outline: none;
        }

        .tag-input:focus {
            border-color: var(--primary);
        }

        .btn-delete {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 2px 6px;
            border-radius: 4px;
            line-height: 1;
        }

        .btn-delete:hover {
            background-color: #fee2e2;
        }

        .column-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 8px;
            max-height: 160px;
            overflow-y: auto;
            padding-top: 6px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            user-select: none;
            background: #fff;
            padding: 4px 8px;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
        }

        .action-link {
            font-size: 0.8rem;
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
        }

        .status-msg {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.88rem;
            display: none;
        }

        .status-msg.success {
            display: block;
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .status-msg.error {
            display: block;
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 sm:p-8 flex flex-col items-center">

    <div class="w-full max-w-6xl space-y-6">
        
        <!-- 階段 1：多檔案合併與欄位設定面板 -->
        <div class="bg-white p-6 rounded-2xl shadow-xl border border-slate-200">
            <h1 class="text-2xl font-bold text-slate-800 mb-2">⚡ Power Log 多檔案整合與圖表工具</h1>
            <p class="text-sm text-slate-500 mb-6">階段一：上傳與管理 log 檔案、修改 Tag、選取欄位後直接整合並動態繪製分析圖表。</p>

            <div class="upload-area mb-4" id="dropZone" onclick="document.getElementById('fileInput').click()">
                <div class="text-3xl mb-1 text-blue-600">📁</div>
                <div class="font-semibold text-slate-700 text-sm">點擊或拖曳 Excel / CSV 檔案至此處新增</div>
                <div class="text-xs text-slate-400">支援格式：.xlsx, .xls, .csv</div>
            </div>
            <input type="file" id="fileInput" multiple accept=".xlsx, .xls, .csv" class="hidden">

            <div id="fileListContainer" class="section-box mb-4" style="display: none;">
                <div class="flex justify-between items-center text-xs font-semibold text-slate-700 mb-2">
                    <span>已選擇的檔案與 Tag 設定：</span>
                    <span class="action-link" onclick="clearAllFiles()">清空所有檔案</span>
                </div>
                <div class="file-list" id="fileList"></div>
            </div>

            <div id="columnSelectContainer" class="section-box mb-4" style="display: none;">
                <div class="flex justify-between items-center text-xs font-semibold text-slate-700 mb-2">
                    <span>選擇要匯整並生成 Sheet 圖表的欄位：</span>
                    <div>
                        <span class="action-link" onclick="toggleSelectAll(true)">全選</span> | 
                        <span class="action-link" onclick="toggleSelectAll(false)">全不選</span>
                    </div>
                </div>
                <div class="column-grid" id="columnGrid"></div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3">
                <button id="processBtn" disabled onclick="processFilesAndGenerateCharts()" 
                        class="flex-1 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white font-semibold py-2.5 rounded-lg transition text-sm shadow">
                    🚀 整合檔案並生成動態圖表
                </button>
            </div>

            <div id="statusMsg" class="status-msg mt-3"></div>
        </div>

        <!-- 階段 2：圖表全域控制與下載面板 -->
        <div id="globalChartControlPanel" class="bg-white p-6 rounded-2xl shadow-xl border border-slate-200" style="display: none;">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4 pb-4 border-b border-slate-200">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">📊 圖表檢視與全域設定</h2>
                    <p class="text-xs text-slate-500">檢視各 Sheet 分析圖表，可調整軸標題、Y 軸極限或匯出含圖表的 Excel 檔案。</p>
                </div>
                <button id="exportBtn" onclick="exportExcelWithCharts()"
                        class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-lg transition text-xs shadow flex items-center gap-1">
                    📥 下載包含圖表的 Excel (.xlsx)
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                <div class="p-3 bg-slate-50 rounded-lg border border-slate-200 space-y-2">
                    <span class="font-semibold text-blue-700 block">全域預設軸標題：</span>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label for="xAxisTitleInput" class="block font-medium text-slate-600">X 軸預設：</label>
                            <input type="text" id="xAxisTitleInput" value="Time" class="w-full border rounded px-2 py-1 bg-white">
                        </div>
                        <div>
                            <label for="yAxisTitleInput" class="block font-medium text-slate-600">Y 軸預設：</label>
                            <input type="text" id="yAxisTitleInput" value="Power Value (vW)" class="w-full border rounded px-2 py-1 bg-white">
                        </div>
                    </div>
                </div>

                <div class="p-3 bg-slate-50 rounded-lg border border-slate-200 space-y-2">
                    <span class="font-semibold text-blue-700 block">統一所有圖表 Y 軸範圍：</span>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label for="globalYMin" class="block font-medium text-slate-600">最小值：</label>
                            <input type="number" step="any" id="globalYMin" placeholder="自動" class="w-full border rounded px-2 py-1 bg-white">
                        </div>
                        <div>
                            <label for="globalYMax" class="block font-medium text-slate-600">最大值：</label>
                            <input type="number" step="any" id="globalYMax" placeholder="自動" class="w-full border rounded px-2 py-1 bg-white">
                        </div>
                    </div>
                    <button onclick="applyGlobalYLimits()" 
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-1 rounded transition mt-1">
                        套用 Y 軸範圍至所有圖表
                    </button>
                </div>
            </div>
        </div>

        <div id="chartsContainer" class="space-y-6"></div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const fileListContainer = document.getElementById('fileListContainer');
        const fileList = document.getElementById('fileList');
        const columnSelectContainer = document.getElementById('columnSelectContainer');
        const columnGrid = document.getElementById('columnGrid');
        const processBtn = document.getElementById('processBtn');
        const statusMsg = document.getElementById('statusMsg');

        let uploadedFiles = [];     
        let parsedFilesData = [];   
        let rawWorkbookData = [];   
        let chartInstances = [];    
        let exportFileName = 'power_log_consolidated_with_charts.xlsx';

        const colorPaletteHex = ['#3b82f6', '#f97316', '#22c55e', '#a855f7', '#ec4899', '#00FFFF', '#eab308', '#ef4444', '#6366f1'];
        const shapePalette = ['circle', 'triangle', 'rect', 'rectRot', 'cross'];

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
            fileInput.value = '';
        });

        function extractTag(filename) {
            let name = filename.replace(/\.(xlsx|xls|csv)$/i, '');
            if (name.startsWith('power_log_')) {
                return name.replace('power_log_', '');
            }
            return name;
        }

        async function handleFiles(files) {
            const validFiles = Array.from(files).filter(f => {
                const lower = f.name.toLowerCase();
                return lower.endsWith('.xlsx') || lower.endsWith('.xls') || lower.endsWith('.csv');
            });
            if (validFiles.length === 0) return;

            validFiles.forEach(newFile => {
                if (!uploadedFiles.some(item => item.file.name === newFile.name)) {
                    uploadedFiles.push({ file: newFile, tag: extractTag(newFile.name) });
                }
            });

            uploadedFiles.sort((a, b) => a.file.name.localeCompare(b.file.name, undefined, {numeric: true, sensitivity: 'base'}));

            renderFileList();
            showStatus('正在讀取檔案欄位...', '');
            await parseUploadedFiles();
        }

        function renderFileList() {
            if (uploadedFiles.length === 0) {
                fileListContainer.style.display = 'none';
                columnSelectContainer.style.display = 'none';
                processBtn.disabled = true;
                return;
            }

            fileList.innerHTML = '';
            uploadedFiles.forEach((item, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden flex-grow">
                        <span class="truncate font-medium text-slate-700" title="${item.file.name}">📄 ${item.file.name}</span>
                    </div>
                    <div class="flex items-center gap-1.5 flex-shrink-0">
                        <span class="text-xs text-slate-400">Tag:</span>
                        <input type="text" class="tag-input" value="${item.tag}" onchange="updateTag(${index}, this.value)">
                        <button class="btn-delete" onclick="removeFile(${index})" title="刪除檔案">✕</button>
                    </div>
                `;
                fileList.appendChild(fileItem);
            });
            fileListContainer.style.display = 'block';
        }

        function updateTag(index, newTag) {
            uploadedFiles[index].tag = newTag.trim() || extractTag(uploadedFiles[index].file.name);
        }

        async function removeFile(index) {
            uploadedFiles.splice(index, 1);
            renderFileList();
            if (uploadedFiles.length > 0) {
                showStatus('已更新檔案列表，重新整理欄位中...', '');
                await parseUploadedFiles();
            } else {
                parsedFilesData = [];
                showStatus('', '');
            }
        }

        function clearAllFiles() {
            uploadedFiles = [];
            parsedFilesData = [];
            renderFileList();
            destroyAllCharts();
            document.getElementById('chartsContainer').innerHTML = '';
            document.getElementById('globalChartControlPanel').style.display = 'none';
            showStatus('', '');
        }

        async function parseUploadedFiles() {
            parsedFilesData = [];
            const allMetricKeys = new Set();

            try {
                for (const item of uploadedFiles) {
                    const arrayBuffer = await item.file.arrayBuffer();
                    const workbook = XLSX.read(arrayBuffer, { type: 'array', cellDates: true });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

                    if (jsonData.length > 0) {
                        Object.keys(jsonData[0]).forEach(key => {
                            if (key.trim().toLowerCase() !== 'time') {
                                allMetricKeys.add(key.trim());
                            }
                        });
                    }

                    parsedFilesData.push({ fileRef: item, rows: jsonData });
                }

                const previouslyChecked = new Set(
                    Array.from(document.querySelectorAll('input[name="metricColumn"]:checked')).map(cb => cb.value)
                );
                const isFirstLoad = previouslyChecked.size === 0;

                columnGrid.innerHTML = '';
                if (allMetricKeys.size === 0) {
                    showStatus('警告：未在檔案中找到可用的數據欄位', 'error');
                    processBtn.disabled = true;
                    columnSelectContainer.style.display = 'none';
                    return;
                }

                allMetricKeys.forEach(metric => {
                    const isChecked = isFirstLoad || previouslyChecked.has(metric);
                    const label = document.createElement('label');
                    label.className = 'checkbox-label';
                    label.innerHTML = `
                        <input type="checkbox" name="metricColumn" value="${metric}" ${isChecked ? 'checked' : ''}>
                        <span>${metric}</span>
                    `;
                    columnGrid.appendChild(label);
                });

                columnSelectContainer.style.display = 'block';
                processBtn.disabled = false;
                showStatus('', '');

            } catch (error) {
                console.error(error);
                showStatus(`檔案讀取失敗：${error.message}`, 'error');
                processBtn.disabled = true;
            }
        }

        function toggleSelectAll(checked) {
            const checkboxes = document.querySelectorAll('input[name="metricColumn"]');
            checkboxes.forEach(cb => cb.checked = checked);
        }

        function showStatus(text, type) {
            if (!text) {
                statusMsg.style.display = 'none';
                return;
            }
            statusMsg.className = 'status-msg ' + type;
            statusMsg.innerText = text;
            statusMsg.style.display = 'block';
        }

        function formatTo24HourTime(val) {
            if (val === null || val === undefined || val === '') return '';
            if (val instanceof Date) return formatDateObj(val);

            if (typeof val === 'number') {
                if (val >= 0 && val < 1) {
                    let totalSeconds = Math.round(val * 86400);
                    let hours = Math.floor(totalSeconds / 3600);
                    let minutes = Math.floor((totalSeconds % 3600) / 60);
                    let seconds = totalSeconds % 60;
                    return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                } else {
                    const dateObj = XLSX.SSF.parse_date_code(val);
                    if (dateObj) {
                        const h = String(dateObj.H || 0).padStart(2, '0');
                        const m = String(dateObj.M || 0).padStart(2, '0');
                        const s = String(dateObj.S || 0).padStart(2, '0');
                        return `${h}:${m}:${s}`;
                    }
                }
            }

            let strVal = String(val).trim();
            const ampmMatch = strVal.match(/^(?:(\d{4}[-\/]\d{1,2}[-\/]\d{1,2})\s+)?(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM|上午|下午)$/i);
            if (ampmMatch) {
                let hours = parseInt(ampmMatch[2], 10);
                let minutes = ampmMatch[3];
                let seconds = ampmMatch[4] || '00';
                let period = ampmMatch[5].toUpperCase();

                if (period === 'PM' || period === '下午') { if (hours < 12) hours += 12; }
                else if (period === 'AM' || period === '上午') { if (hours === 12) hours = 0; }

                return `${String(hours).padStart(2, '0')}:${minutes}:${seconds}`;
            }

            const hmsMatch = strVal.match(/^(?:(\d{4}[-\/]\d{1,2}[-\/]\d{1,2})\s+)?(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
            if (hmsMatch) {
                let hours = String(parseInt(hmsMatch[2], 10)).padStart(2, '0');
                let minutes = hmsMatch[3];
                let seconds = hmsMatch[4] || '00';
                return `${hours}:${minutes}:${seconds}`;
            }

            return strVal;
        }

        function parseExcelTimeValue(val) {
            let formatted = formatTo24HourTime(val);
            if (formatted.length >= 5 && formatted.includes(':')) {
                return formatted.substring(0, 5); 
            }
            return formatted;
        }

        function formatDateObj(d) {
            const h = String(d.getHours()).padStart(2, '0');
            const m = String(d.getMinutes()).padStart(2, '0');
            const s = String(d.getSeconds()).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        async function processFilesAndGenerateCharts() {
            if (parsedFilesData.length === 0) return;

            const selectedColumns = Array.from(document.querySelectorAll('input[name="metricColumn"]:checked')).map(cb => cb.value);
            if (selectedColumns.length === 0) {
                showStatus('請至少勾選一個要匯整的欄位！', 'error');
                return;
            }

            processBtn.disabled = true;
            showStatus('資料處理與整合中...', '');

            try {
                rawWorkbookData = [];

                selectedColumns.forEach(metric => {
                    const headerRow = [];
                    parsedFilesData.forEach(fileObj => {
                        headerRow.push('Time');
                        headerRow.push(`${metric}_${fileObj.fileRef.tag}`);
                    });

                    let maxRows = 0;
                    parsedFilesData.forEach(fileObj => {
                        if (fileObj.rows.length > maxRows) maxRows = fileObj.rows.length;
                    });

                    const sheetData = [headerRow];

                    for (let r = 0; r < maxRows; r++) {
                        const rowData = [];
                        parsedFilesData.forEach(fileObj => {
                            const row = fileObj.rows[r];
                            if (row) {
                                const rawTimeVal = row['Time'] !== undefined ? row['Time'] : (row['time'] !== undefined ? row['time'] : '');
                                const timeVal = formatTo24HourTime(rawTimeVal);
                                const metricVal = row[metric] !== undefined ? row[metric] : '';
                                rowData.push(timeVal);
                                rowData.push(metricVal);
                            } else {
                                rowData.push('');
                                rowData.push('');
                            }
                        });
                        sheetData.push(rowData);
                    }

                    const cleanSheetName = metric.replace(/[\\/?*\[\]]/g, '_').substring(0, 31);

                    rawWorkbookData.push({
                        sheetName: cleanSheetName,
                        rows: sheetData
                    });
                });

                showStatus(`整合成功！已產生 ${selectedColumns.length} 個 Sheet 數據，正在繪製圖表...`, 'success');

                document.getElementById('globalChartControlPanel').style.display = 'block';
                renderAllChartsFromRawData();

            } catch (error) {
                console.error(error);
                showStatus(`處理失敗：${error.message}`, 'error');
            } finally {
                processBtn.disabled = false;
            }
        }

        function destroyAllCharts() {
            chartInstances.forEach(item => {
                if (item.chart) item.chart.destroy();
            });
            chartInstances = [];
        }

        function renderAllChartsFromRawData() {
            destroyAllCharts();
            const container = document.getElementById('chartsContainer');
            container.innerHTML = '';

            rawWorkbookData.forEach((data, index) => {
                createSheetChartCard(data.sheetName, index);
            });
        }

        function drawMarkerShape(ctx, shape, x, y, size, color) {
            ctx.save();
            ctx.fillStyle = color;
            ctx.strokeStyle = color;
            ctx.beginPath();
            
            if (shape === 'triangle') {
                ctx.moveTo(x, y - size);
                ctx.lineTo(x - size, y + size);
                ctx.lineTo(x + size, y + size);
                ctx.closePath();
                ctx.fill();
            } else if (shape === 'rect') {
                ctx.fillRect(x - size, y - size, size * 2, size * 2);
            } else if (shape === 'rectRot') {
                ctx.moveTo(x, y - size);
                ctx.lineTo(x + size, y);
                ctx.lineTo(x, y + size);
                ctx.lineTo(x - size, y);
                ctx.closePath();
                ctx.fill();
            } else if (shape === 'cross') {
                ctx.lineWidth = 1;
                ctx.moveTo(x - size, y);
                ctx.lineTo(x + size, y);
                ctx.moveTo(x, y - size);
                ctx.lineTo(x, y + size);
                ctx.stroke();
            } else {
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        const whiteBackgroundPlugin = {
            id: 'customCanvasBackgroundColor',
            beforeDraw: (chart) => {
                const { ctx } = chart;
                ctx.save();
                ctx.globalCompositeOperation = 'destination-over';
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, chart.width, chart.height);
                ctx.restore();
            }
        };

        function createSheetChartCard(sheetName, index) {
            const sheetData = rawWorkbookData.find(d => d.sheetName === sheetName);
            if (!sheetData || !sheetData.rows || sheetData.rows.length < 2) return;

            const rows = sheetData.rows;
            const maxCols = Math.max(...rows.map(r => r ? r.length : 0));
            const runCount = Math.max(1, Math.floor(maxCols / 2));

            const container = document.getElementById('chartsContainer');
            const card = document.createElement('div');
            card.className = "bg-white p-6 rounded-2xl shadow-lg flex flex-col md:flex-row gap-6 border border-slate-100";
            card.id = `sheet-card-${index}`;

            const globalMin = document.getElementById('globalYMin').value;
            const globalMax = document.getElementById('globalYMax').value;
            const defaultXTitle = document.getElementById('xAxisTitleInput').value.trim() || 'Time';
            const defaultYTitle = document.getElementById('yAxisTitleInput').value.trim() || 'Power Value (vW)';
            const defaultChartTitle = `${sheetName} Power (vW)`;

            let runsInputsHtml = '';
            for (let r = 0; r < runCount; r++) {
                const defaultColor = colorPaletteHex[r % colorPaletteHex.length];
                const defaultShape = shapePalette[r % shapePalette.length];

                runsInputsHtml += `
                    <div class="p-2 border border-slate-200 rounded-lg bg-white space-y-1.5">
                        <div class="flex items-center gap-2">
                            <input type="text" id="run_${index}_${r}" placeholder="測試 ${r + 1}" class="w-1/2 border rounded px-2 py-1 text-xs">
                            <input type="text" id="time_${index}_${r}" placeholder="時間 ${r + 1}" class="w-1/2 border rounded px-2 py-1 text-center text-xs">
                        </div>
                        <div class="flex items-center justify-between gap-2 pt-0.5">
                            <div class="flex items-center gap-1">
                                <label class="text-slate-500 text-[11px]">圖示:</label>
                                <select id="shape_${index}_${r}" class="border rounded px-1 py-0.5 text-xs bg-slate-50">
                                    <option value="circle" ${defaultShape === 'circle' ? 'selected' : ''}>● 圓形</option>
                                    <option value="triangle" ${defaultShape === 'triangle' ? 'selected' : ''}>▲ 三角</option>
                                    <option value="rect" ${defaultShape === 'rect' ? 'selected' : ''}>■ 正方</option>
                                    <option value="rectRot" ${defaultShape === 'rectRot' ? 'selected' : ''}>◆ 菱形</option>
                                    <option value="cross" ${defaultShape === 'cross' ? 'selected' : ''}>┼ 十字</option>
                                </select>
                            </div>
                            <div class="flex items-center gap-1">
                                <label class="text-slate-500 text-[11px]">顏色:</label>
                                <input type="color" id="color_${index}_${r}" value="${defaultColor}" class="w-7 h-6 p-0 border rounded cursor-pointer">
                            </div>
                        </div>
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="w-full md:w-1/3 flex flex-col gap-3 bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs">
                    <div class="font-bold text-sm text-slate-800 border-b border-slate-200 pb-2 flex justify-between items-center">
                        <span>Sheet: ${sheetName}</span>
                        <span class="text-xs font-normal text-blue-600 bg-blue-50 px-2 py-0.5 rounded">${runCount} 組數據</span>
                    </div>

                    <div class="space-y-1.5 border-b border-slate-200 pb-2">
                        <div class="font-medium text-slate-700">獨立標題與軸名稱設定：</div>
                        <div>
                            <label class="text-slate-500 block">圖表標題 (Title)：</label>
                            <input type="text" id="chartTitle_${index}" value="${defaultChartTitle}" class="w-full border rounded px-2 py-1 bg-white">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-slate-500 block">X 軸標題：</label>
                                <input type="text" id="xTitle_${index}" value="${defaultXTitle}" class="w-full border rounded px-2 py-1 bg-white">
                            </div>
                            <div>
                                <label class="text-slate-500 block">Y 軸標題：</label>
                                <input type="text" id="yTitle_${index}" value="${defaultYTitle}" class="w-full border rounded px-2 py-1 bg-white">
                            </div>
                        </div>
                    </div>

                    <div class="space-y-1.5 border-b border-slate-200 pb-2">
                        <div class="font-medium text-slate-600">測試項目樣式設定：</div>
                        <div class="max-h-52 overflow-y-auto space-y-2 pr-1">
                            ${runsInputsHtml}
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <div class="font-medium text-slate-700">Y 軸與平均線設定：</div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-slate-500 block">Y 最小值：</label>
                                <input type="number" step="any" id="yMin_${index}" value="${globalMin}" placeholder="自動" class="w-full border rounded px-2 py-1 bg-white">
                            </div>
                            <div>
                                <label class="text-slate-500 block">Y 最大值：</label>
                                <input type="number" step="any" id="yMax_${index}" value="${globalMax}" placeholder="自動" class="w-full border rounded px-2 py-1 bg-white">
                            </div>
                        </div>
                        <div class="flex items-center gap-2 pt-1">
                            <input type="checkbox" id="showAvg_${index}" checked class="rounded text-blue-600 border-slate-300">
                            <label for="showAvg_${index}" class="text-xs text-slate-700 font-medium cursor-pointer">顯示平均線 (Average Line)</label>
                        </div>
                    </div>

                    <button onclick="drawSingleSheetChart('${sheetName}', ${index})" 
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-1.5 rounded transition mt-2">
                        更新此圖表
                    </button>
                </div>

                <div class="w-full md:w-2/3 flex flex-col">
                    <div class="border border-slate-200 rounded-xl p-4 bg-white relative flex flex-col">
                        <div class="h-[380px] relative min-h-0">
                            <canvas id="canvas_${index}"></canvas>
                        </div>
                        <div id="legend_${index}" class="mt-4 pt-3 border-t border-slate-100 flex flex-wrap gap-x-6 gap-y-2 text-xs font-medium text-slate-700"></div>
                    </div>
                </div>
            `;

            container.appendChild(card);
            drawSingleSheetChart(sheetName, index);
        }

        function drawSingleSheetChart(sheetName, index) {
            const sheetData = rawWorkbookData.find(d => d.sheetName === sheetName);
            if (!sheetData) return;
            const rows = sheetData.rows;
            if (!rows || rows.length < 2) return;

            const headerCols = rows[0] || [];
            const firstDataCols = rows[1] || [];

            const maxCols = Math.max(...rows.map(r => r ? r.length : 0));
            const runCount = Math.max(1, Math.floor(maxCols / 2));

            const datasetsData = Array.from({ length: runCount }, () => []);

            for (let r = 0; r < runCount; r++) {
                const runInput = document.getElementById(`run_${index}_${r}`);
                const timeInput = document.getElementById(`time_${index}_${r}`);
                const nameColIdx = r * 2 + 1;
                const timeColIdx = r * 2;

                if (runInput && !runInput.value) {
                    runInput.value = headerCols[nameColIdx] ? String(headerCols[nameColIdx]).trim() : `測試 ${r + 1}`;
                }
                if (timeInput && !timeInput.value) {
                    timeInput.value = parseExcelTimeValue(firstDataCols[timeColIdx]);
                }
            }

            for (let i = 1; i < rows.length; i++) {
                const columns = rows[i];
                if (!columns || columns.length === 0) continue;

                for (let r = 0; r < runCount; r++) {
                    const valIdx = r * 2 + 1;
                    if (columns.length > valIdx) {
                        const val = parseFloat(columns[valIdx]);
                        if (!isNaN(val)) {
                            datasetsData[r].push({ x: datasetsData[r].length + 1, y: val });
                        }
                    }
                }
            }

            const chartDatasets = [];
            const showAvg = document.getElementById(`showAvg_${index}`).checked;

            for (let r = 0; r < runCount; r++) {
                const runName = document.getElementById(`run_${index}_${r}`).value.trim() || `測試 ${r + 1}`;
                const runTime = document.getElementById(`time_${index}_${r}`).value.trim();
                const shape = document.getElementById(`shape_${index}_${r}`) ? document.getElementById(`shape_${index}_${r}`).value : shapePalette[r % shapePalette.length];
                const color = document.getElementById(`color_${index}_${r}`) ? document.getElementById(`color_${index}_${r}`).value : colorPaletteHex[r % colorPaletteHex.length];

                const dataset = datasetsData[r];
                const calcAvg = dataset.length > 0 ? (dataset.reduce((sum, d) => sum + d.y, 0) / dataset.length) : null;
                const label = runName + (runTime ? ` (${runTime})` : '');

                chartDatasets.push({
                    label: label,
                    data: dataset,
                    borderColor: color,
                    backgroundColor: color,
                    borderWidth: 2,
                    pointStyle: shape,
                    pointRadius: 2,
                    pointHoverRadius: 4,
                    avgValue: calcAvg,
                    runIndex: r
                });
            }

            if (showAvg) {
                for (let r = 0; r < runCount; r++) {
                    const mainDataset = chartDatasets[r];
                    const avg = mainDataset.avgValue;
                    const len = mainDataset.data.length;

                    if (avg !== null && len > 0) {
                        chartDatasets.push({
                            label: `${mainDataset.label} Avg Line`,
                            data: [{ x: 1, y: avg }, { x: len, y: avg }],
                            borderColor: mainDataset.borderColor,
                            borderWidth: 1.5,
                            borderDash: [4, 4],
                            pointRadius: 0,
                            isAvgLine: true,
                            parentIndex: r
                        });
                    }
                }
            }

            const chartTitle = document.getElementById(`chartTitle_${index}`).value.trim();
            const xAxisTitle = document.getElementById(`xTitle_${index}`).value.trim() || 'Time';
            const yAxisTitle = document.getElementById(`yTitle_${index}`).value.trim() || 'Power Value (vW)';

            const yMin = document.getElementById(`yMin_${index}`).value;
            const yMax = document.getElementById(`yMax_${index}`).value;

            const yScaleConfig = { title: { display: true, text: yAxisTitle } };
            if (yMin !== '') yScaleConfig.min = parseFloat(yMin);
            if (yMax !== '') yScaleConfig.max = parseFloat(yMax);

            const existingIndex = chartInstances.findIndex(item => item.index === index);
            if (existingIndex !== -1) {
                chartInstances[existingIndex].chart.destroy();
                chartInstances.splice(existingIndex, 1);
            }

            const ctx = document.getElementById(`canvas_${index}`).getContext('2d');
            const newChart = new Chart(ctx, {
                type: 'line',
                data: { datasets: chartDatasets },
                plugins: [whiteBackgroundPlugin],
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    plugins: {
                        title: { display: true, text: chartTitle, font: { size: 14 } },
                        legend: { display: false }
                    },
                    scales: {
                        x: { 
                            type: 'linear',
                            title: { display: true, text: xAxisTitle },
                            ticks: { stepSize: 1 }
                        },
                        y: yScaleConfig
                    }
                }
            });

            chartInstances.push({ index, sheetName, chart: newChart, canvasId: `canvas_${index}`, runCount });
            renderCustomLeftAlignedLegend(newChart, `legend_${index}`, runCount);
        }

        function renderCustomLeftAlignedLegend(chart, containerId, runCount) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';

            chart.data.datasets.forEach((dataset, idx) => {
                if (dataset.isAvgLine) return;

                const isVisible = chart.isDatasetVisible(idx);
                const itemBox = document.createElement('div');
                itemBox.className = `flex items-start gap-2 cursor-pointer transition-opacity duration-200 ${isVisible ? 'opacity-100' : 'opacity-30 line-through'}`;
                
                itemBox.onclick = () => {
                    const nextVisible = !chart.isDatasetVisible(idx);
                    chart.setDatasetVisibility(idx, nextVisible);

                    const avgLineIdx = chart.data.datasets.findIndex(ds => ds.isAvgLine && ds.parentIndex === idx);
                    if (avgLineIdx !== -1) {
                        chart.setDatasetVisibility(avgLineIdx, nextVisible);
                    }

                    chart.update();
                    renderCustomLeftAlignedLegend(chart, containerId, runCount);
                };

                const legendCanvas = document.createElement('canvas');
                legendCanvas.width = 14;
                legendCanvas.height = 14;
                legendCanvas.className = 'mt-0.5 flex-shrink-0';
                const lctx = legendCanvas.getContext('2d');
                drawMarkerShape(lctx, dataset.pointStyle || 'circle', 7, 7, 3.5, dataset.borderColor);

                const textGroup = document.createElement('div');
                textGroup.className = 'flex flex-col text-left leading-tight';

                const titleLabel = document.createElement('span');
                titleLabel.className = 'font-semibold text-slate-800';
                titleLabel.innerText = dataset.label;

                const avgLabel = document.createElement('span');
                avgLabel.className = 'text-xs font-bold text-slate-500 mt-0.5';
                avgLabel.innerText = dataset.avgValue !== null ? `Avg: ${dataset.avgValue.toFixed(2)}` : 'Avg: N/A';

                textGroup.appendChild(titleLabel);
                textGroup.appendChild(avgLabel);

                itemBox.appendChild(legendCanvas);
                itemBox.appendChild(textGroup);

                container.appendChild(itemBox);
            });
        }

        function applyGlobalYLimits() {
            const globalMin = document.getElementById('globalYMin').value;
            const globalMax = document.getElementById('globalYMax').value;

            rawWorkbookData.forEach((data, index) => {
                const yMinInput = document.getElementById(`yMin_${index}`);
                const yMaxInput = document.getElementById(`yMax_${index}`);

                if (yMinInput) yMinInput.value = globalMin;
                if (yMaxInput) yMaxInput.value = globalMax;

                drawSingleSheetChart(data.sheetName, index);
            });
        }

     // --- 模擬 HTML 視窗最大化時的 Excel 圖表匯出函數 ---
async function exportExcelWithCharts() {
    if (!rawWorkbookData || rawWorkbookData.length === 0) {
        showStatus('沒有可匯出的數據！', 'error');
        return;
    }

    const exportBtn = document.getElementById('exportBtn');
    exportBtn.innerText = '⏳ 正在以 HTML 最大化視窗尺寸建構 Excel 圖表...';
    exportBtn.disabled = true;

    try {
        const wb = new ExcelJS.Workbook();

        // 定義 HTML 視窗拉至最大時的網頁 Canvas 理想寬高度 (全螢幕 16:9 / 1080p 規格)
        const htmlMaxWindowWidth = 1400;  // 模擬 HTML 全螢幕時的圖表寬度 (px)
        const htmlMaxChartHeight = 700;   // 模擬 HTML 全螢幕時的圖表高度 (px)

        for (const sheetObj of rawWorkbookData) {
            const worksheet = wb.addWorksheet(sheetObj.sheetName);
            
            // 寫入數據列表
            sheetObj.rows.forEach(row => {
                worksheet.addRow(row);
            });

            const item = chartInstances.find(c => c.sheetName === sheetObj.sheetName);
            if (!item) continue;

            const chart = item.chart;

            // ----------------------------------------------------
            // 1. 動態計算全螢幕狀態下的圖例 (Legend) 排版高度
            // ----------------------------------------------------
            const runCount = item.runCount || 1;
            const rowsOfLegend = Math.ceil(runCount / 3); // 每行 3 個標籤
            const legendHeight = 40 + (rowsOfLegend * 45); // 圖例所需高度

            const totalMaxHeight = htmlMaxChartHeight + legendHeight;

            // ----------------------------------------------------
            // 2. 建立「網頁全螢幕/最大化」規模的離屏 Canvas (2K 超高清)
            // ----------------------------------------------------
            const scaleFactor = 2; // 2 倍 DPI 防止圖片模糊
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = htmlMaxWindowWidth * scaleFactor;
            exportCanvas.height = totalMaxHeight * scaleFactor;

            const ctx = exportCanvas.getContext('2d');
            ctx.scale(scaleFactor, scaleFactor);
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            // 填滿背景色 (純白)
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, htmlMaxWindowWidth, totalMaxHeight);

            // ----------------------------------------------------
            // 3. 直接使用螢幕 Canvas 繪製最大化比例的圖表本體
            // ----------------------------------------------------
            const sourceCanvas = document.getElementById(item.canvasId);
            if (sourceCanvas) {
                // 將畫面的 Canvas 強制拉伸/適應至 HTML 最大化尺寸繪製
                ctx.drawImage(sourceCanvas, 0, 0, htmlMaxWindowWidth, htmlMaxChartHeight);
            }

            // ----------------------------------------------------
            // 4. 繪製全螢幕比例對應的大字體圖例 (Legend)
            // ----------------------------------------------------
            let startX = 80;
            let startY = htmlMaxChartHeight + 35;
            let colCount = 0;

            ctx.font = 'bold 15px sans-serif';
            ctx.textAlign = 'left';

            chart.data.datasets.forEach((ds) => {
                if (ds.isAvgLine) return;

                // 繪製標記圖示
                drawMarkerShape(ctx, ds.pointStyle || 'circle', startX, startY - 5, 5, ds.borderColor);

                // 標題與平均值文字
                ctx.fillStyle = '#1e293b';
                ctx.fillText(ds.label, startX + 20, startY);

                ctx.fillStyle = '#64748b';
                const avgStr = ds.avgValue !== null ? `Avg: ${ds.avgValue.toFixed(2)}` : 'Avg: N/A';
                ctx.fillText(avgStr, startX + 20, startY + 22);

                startX += 380; // 最大化全寬時的橫向間距
                colCount++;

                if (colCount % 3 === 0) {
                    startX = 80;
                    startY += 50;
                }
            });

            // 繪製外框
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            ctx.strokeRect(0, 0, htmlMaxWindowWidth, totalMaxHeight);

            // ----------------------------------------------------
            // 5. 將「HTML 最大化尺寸圖表」寫入 Excel
            // ----------------------------------------------------
            const dataUrl = exportCanvas.toDataURL('image/png', 1.0);
            const base64Data = dataUrl.replace(/^data:image\/png;base64,/, "");

            const imageId = wb.addImage({
                base64: base64Data,
                extension: 'png',
            });

            const maxCols = Math.max(...sheetObj.rows.map(r => r ? r.length : 0));
            const insertCol = maxCols + 1;

            // 貼入 Excel 尺寸（寬度設為 960pt，高度依據 HTML 最大化時的長寬比精準縮放）
            const excelWidth = 960; 
            const excelHeight = excelWidth * (totalMaxHeight / htmlMaxWindowWidth);

            worksheet.addImage(imageId, {
                tl: { col: insertCol, row: 1 }, 
                ext: { width: excelWidth, height: excelHeight }
            });
        }

        // ----------------------------------------------------
        // 6. 下載 Excel 檔案
        // ----------------------------------------------------
        const buffer = await wb.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.download = `[Chart]_` + exportFileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        setTimeout(() => URL.revokeObjectURL(url), 1000);

        showStatus('成功以「HTML 全螢幕最大化尺寸」匯出超清晰 Excel 圖表！', 'success');

    } catch (err) {
        console.error(err);
        showStatus(`匯出圖表 Excel 失敗：${err.message}`, 'error');
    } finally {
        exportBtn.innerText = '📥 下載包含圖表的 Excel (.xlsx)';
        exportBtn.disabled = false;
    }
}

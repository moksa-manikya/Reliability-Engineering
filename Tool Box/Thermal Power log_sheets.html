<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Power_log 多 Sheet 分析圖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 引入 SheetJS 解析 Excel 檔案 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 sm:p-8 flex flex-col items-center">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-5xl">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">📊 Power_log 分析圖 (多 Sheet 支援)</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <!-- 左側控制面板 -->
            <div class="md:col-span-1 flex flex-col gap-4 bg-gray-50 p-4 rounded-xl border border-gray-200">
                
                <!-- Excel 檔案匯入區 -->
                <div class="border-b border-gray-200 pb-3">
                    <label class="block font-medium text-blue-700 mb-1 text-sm">1. 匯入 Excel 檔案 (.xlsx)：</label>
                    <input type="file" id="excelFileInput" accept=".xlsx, .xls" 
                           class="w-full text-xs text-gray-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                </div>

                <!-- 工作表 (Sheet) 切換選單 -->
                <div class="border-b border-gray-200 pb-3">
                    <label for="sheetSelect" class="block font-medium text-blue-700 mb-1 text-sm">2. 選擇工作表 (Sheet)：</label>
                    <select id="sheetSelect" class="w-full border border-gray-300 rounded-lg px-2.5 py-1.5 text-xs bg-white focus:ring-2 focus:ring-blue-500" disabled>
                        <option value="">請先上傳 Excel 檔案</option>
                    </select>
                </div>

                <!-- 測試名稱與初始時間對應排列 -->
                <div class="flex flex-col gap-2 mb-1">
                    <div class="text-xs font-medium text-gray-600">測試名稱與初始時間：</div>
                    
                    <div class="flex items-center gap-2">
                        <input type="text" id="kauaiRun1" placeholder="測試 1 名稱" class="w-1/2 border rounded px-2 py-1 text-xs font-medium border-gray-300">
                        <input type="text" id="startTime1" placeholder="初始時間 1" class="w-1/2 border border-gray-300 rounded px-2 py-1 text-xs text-center bg-white">
                    </div>

                    <div class="flex items-center gap-2">
                        <input type="text" id="kauaiRun2" placeholder="測試 2 名稱" class="w-1/2 border rounded px-2 py-1 text-xs font-medium border-gray-300">
                        <input type="text" id="startTime2" placeholder="初始時間 2" class="w-1/2 border border-gray-300 rounded px-2 py-1 text-xs text-center bg-white">
                    </div>

                    <div class="flex items-center gap-2">
                        <input type="text" id="kauaiRun3" placeholder="測試 3 名稱" class="w-1/2 border rounded px-2 py-1 text-xs font-medium border-gray-300">
                        <input type="text" id="startTime3" placeholder="初始時間 3" class="w-1/2 border border-gray-300 rounded px-2 py-1 text-xs text-center bg-white">
                    </div>
                </div>

                <!-- 圖表標題與軸名稱設定 -->
                <div class="space-y-2 border-t border-gray-200 pt-3">
                    <div>
                        <label for="chartTitleInput" class="block font-medium text-gray-700 mb-0.5 text-xs">圖表標題：</label>
                        <input type="text" id="chartTitleInput" value="Power (vW)" class="w-full border border-gray-300 rounded-lg px-2.5 py-1 text-xs">
                    </div>
                    <div>
                        <label for="xAxisTitleInput" class="block font-medium text-gray-700 mb-0.5 text-xs">X 軸標題：</label>
                        <input type="text" id="xAxisTitleInput" value="Time" class="w-full border border-gray-300 rounded-lg px-2.5 py-1 text-xs">
                    </div>
                    <div>
                        <label for="yAxisTitleInput" class="block font-medium text-gray-700 mb-0.5 text-xs">Y 軸標題：</label>
                        <input type="text" id="yAxisTitleInput" value="Power Value (vW)" class="w-full border border-gray-300 rounded-lg px-2.5 py-1 text-xs">
                    </div>
                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <div>
                            <label for="yMinInput" class="block font-medium text-gray-700 mb-0.5 text-xs">Y 軸最小值：</label>
                            <input type="number" step="any" id="yMinInput" placeholder="自動" class="w-full border border-gray-300 rounded-lg px-2.5 py-1 text-xs">
                        </div>
                        <div>
                            <label for="yMaxInput" class="block font-medium text-gray-700 mb-0.5 text-xs">Y 軸最大值：</label>
                            <input type="number" step="any" id="yMaxInput" placeholder="自動" class="w-full border border-gray-300 rounded-lg px-2.5 py-1 text-xs">
                        </div>
                    </div>
                </div>

                <button onclick="drawChartFromCurrentSheet()" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md text-sm">
                    重新繪製當前 Sheet 圖表
                </button>
            </div>

            <!-- 右側圖表區 -->
            <div class="md:col-span-2 flex flex-col justify-center">
                <div class="border border-gray-200 rounded-xl p-4 bg-white relative h-[520px] flex flex-col">
                    <div class="flex-1 relative min-h-0">
                        <canvas id="chart1"></canvas>
                    </div>
                    <div id="customLegend" class="flex flex-col gap-1 mt-3 pt-2 border-t border-gray-100 text-xs font-medium text-gray-700 items-start pl-4"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let workbook = null;
        let chart1Instance = null;

        document.getElementById('excelFileInput').addEventListener('change', handleFileUpload);
        document.getElementById('sheetSelect').addEventListener('change', onSheetChange);

        // 工具函式：格式化初始時間欄位（修正 1:24時間制或小數時間）
        function formatExcelTime(val) {
            if (val === null || val === undefined || val === '') return '';
            
            // 若為 Excel 數字格式的時間（0~1 之間的小數）
            if (typeof val === 'number') {
                const totalSeconds = Math.round(val * 86400);
                const hours = Math.floor(totalSeconds / 3600) % 24;
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const seconds = totalSeconds % 60;
                return [hours, minutes, seconds].map(v => String(v).padStart(2, '0')).join(':');
            }
            
            return String(val).trim();
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (event) {
                const data = new Uint8Array(event.target.result);
                workbook = XLSX.read(data, { type: 'array' });

                const sheetSelect = document.getElementById('sheetSelect');
                sheetSelect.innerHTML = '';
                
                workbook.SheetNames.forEach((sheetName) => {
                    const option = document.createElement('option');
                    option.value = sheetName;
                    option.textContent = sheetName;
                    sheetSelect.appendChild(option);
                });

                sheetSelect.disabled = false;
                onSheetChange();
            };
            reader.readAsArrayBuffer(file);
        }

        function onSheetChange() {
            const selectedSheetName = document.getElementById('sheetSelect').value;
            if (!selectedSheetName) return;

            // 圖表標題動態帶入 "[Sheet名稱] Power (vW)"
            document.getElementById('chartTitleInput').value = `${selectedSheetName} Power (vW)`;

            drawChartFromCurrentSheet();
        }

        function drawChartFromCurrentSheet() {
            if (!workbook) return;

            const selectedSheetName = document.getElementById('sheetSelect').value;
            if (!selectedSheetName) return;

            const worksheet = workbook.Sheets[selectedSheetName];
            const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

            if (rows.length < 2) {
                alert('該 Sheet 數據列數不足！');
                return;
            }

            // 1. 解析第一列 (Header)
            const headerCols = rows[0] || [];
            document.getElementById('kauaiRun1').value = headerCols[1] ? String(headerCols[1]).trim() : '測試 1';
            document.getElementById('kauaiRun2').value = headerCols[3] ? String(headerCols[3]).trim() : '測試 2';
            document.getElementById('kauaiRun3').value = headerCols[5] ? String(headerCols[5]).trim() : '測試 3';

            // 2. 解析第二列 (初始時間 - 轉譯呈現)
            const firstDataCols = rows[1] || [];
            document.getElementById('startTime1').value = formatExcelTime(firstDataCols[0]);
            document.getElementById('startTime2').value = formatExcelTime(firstDataCols[2]);
            document.getElementById('startTime3').value = formatExcelTime(firstDataCols[4]);

            // 3. 解析數據（恢復為以 {x: 數值, y: 數值} 的 1, 2, 3... 數字序列）
            const dataset1 = [];
            const dataset2 = [];
            const dataset3 = [];

            for (let i = 1; i < rows.length; i++) {
                const columns = rows[i];
                if (!columns || columns.length === 0) continue;

                if (columns.length >= 6) {
                    const v1 = parseFloat(columns[1]);
                    const v2 = parseFloat(columns[3]);
                    const v3 = parseFloat(columns[5]);

                    if (!isNaN(v1)) dataset1.push({ x: dataset1.length + 1, y: v1 });
                    if (!isNaN(v2)) dataset2.push({ x: dataset2.length + 1, y: v2 });
                    if (!isNaN(v3)) dataset3.push({ x: dataset3.length + 1, y: v3 });
                } else if (columns.length >= 4) {
                    const v1 = parseFloat(columns[1]);
                    const v2 = parseFloat(columns[2]);
                    const v3 = parseFloat(columns[3]);

                    if (!isNaN(v1)) dataset1.push({ x: dataset1.length + 1, y: v1 });
                    if (!isNaN(v2)) dataset2.push({ x: dataset2.length + 1, y: v2 });
                    if (!isNaN(v3)) dataset3.push({ x: dataset3.length + 1, y: v3 });
                }
            }

            // 4. 組合圖例名稱
            const t1 = document.getElementById('startTime1').value.trim();
            const t2 = document.getElementById('startTime2').value.trim();
            const t3 = document.getElementById('startTime3').value.trim();

            const kauai_names = [
                (document.getElementById('kauaiRun1').value.trim() || '測試 1') + (t1 ? ` (${t1})` : ''),
                (document.getElementById('kauaiRun2').value.trim() || '測試 2') + (t2 ? ` (${t2})` : ''),
                (document.getElementById('kauaiRun3').value.trim() || '測試 3') + (t3 ? ` (${t3})` : '')
            ];

            // 5. 設定軸名稱與繪製圖表
            const chartTitle = document.getElementById('chartTitleInput').value.trim();
            const xAxisTitle = document.getElementById('xAxisTitleInput').value.trim() || 'Time';
            const yAxisTitle = document.getElementById('yAxisTitleInput').value.trim() || 'Power Value (vW)';

            const yMinVal = document.getElementById('yMinInput').value;
            const yMaxVal = document.getElementById('yMaxInput').value;

            if (chart1Instance) chart1Instance.destroy();

            const yScaleConfig = { title: { display: true, text: yAxisTitle } };
            if (yMinVal !== '') yScaleConfig.min = parseFloat(yMinVal);
            if (yMaxVal !== '') yScaleConfig.max = parseFloat(yMaxVal);

            const ctx1 = document.getElementById('chart1').getContext('2d');
            chart1Instance = new Chart(ctx1, {
                type: 'line',
                data: {
                    datasets: [
                        { label: kauai_names[0], data: dataset1, borderColor: 'rgb(59, 130, 246)', borderWidth: 2, pointRadius: 3 },
                        { label: kauai_names[1], data: dataset2, borderColor: 'rgb(249, 115, 22)', borderWidth: 2, pointRadius: 3 },
                        { label: kauai_names[2], data: dataset3, borderColor: 'rgb(34, 197, 94)', borderWidth: 2, pointRadius: 3 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: chartTitle, font: { size: 16 } },
                        legend: { display: false }
                    },
                    scales: {
                        x: { 
                            type: 'linear',
                            title: { display: true, text: xAxisTitle },
                            ticks: { stepSize: 1 } // 確保 X 軸間隔為 1 (1, 2, 3, 4...)
                        },
                        y: yScaleConfig
                    }
                }
            });

            updateCustomLegend(chart1Instance);
        }

        function updateCustomLegend(chart) {
            const legendContainer = document.getElementById('customLegend');
            legendContainer.innerHTML = '';

            chart.data.datasets.forEach((dataset, index) => {
                const isHidden = !chart.isDatasetVisible(index);

                const item = document.createElement('div');
                item.className = `flex items-center gap-2 cursor-pointer transition-opacity duration-200 ${isHidden ? 'opacity-40 line-through' : 'opacity-100'}`;
                item.onclick = () => {
                    chart.setDatasetVisibility(index, !chart.isDatasetVisible(index));
                    chart.update();
                    updateCustomLegend(chart);
                };

                const colorBox = document.createElement('span');
                colorBox.className = 'w-4 h-2.5 rounded-sm inline-block flex-shrink-0';
                colorBox.style.backgroundColor = dataset.borderColor;

                const text = document.createElement('span');
                text.innerText = dataset.label;

                item.appendChild(colorBox);
                item.appendChild(text);
                legendContainer.appendChild(item);
            });
        }
    </script>
</body>
</html>

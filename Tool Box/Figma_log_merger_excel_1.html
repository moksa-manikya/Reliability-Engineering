<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Energy Monitor - Multi-file CSV Aggregator</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- PapaParse CDN for CSV Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- Chart.js for data visualization -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- ExcelJS for advanced Excel export with images -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <!-- Babel for JSX transformation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-white text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback, useRef, useEffect } = React;

    const METRICS = ['Kauai', 'AR1', 'AR2', 'total_battery'];

    // 色彩設定
    const COLORS = [
      '#2563eb', // 1. 圓形: 藍色 (Blue)
      '#d97706', // 2. 三角形: 琥珀橘 (Amber)
      '#db2777', // 3. 正方形: 桃粉色 (Pink)
      '#a0e83a', // 4. 旋轉正方形: 亮鮮綠 (Deep Green)
      '#7c3aed', // 5. 十字: 紫色 (Purple)
      '#21b2fc', // 6. 星號: 亮青藍 (Teal Blue)
      '#dc2626', // 7. 空心圓: 紅色 (Red)
      '#65a30d', // 8. 空心三角形: 橄欖綠 (Lime)
      '#ea580c', // 9. 空心正方形: 橙紅 (Orange Red)
      '#4f46e5', // 10. 空心旋轉正方形: 靛藍 (Indigo)
    ];

    const POINT_STYLES = [
      'circle',
      'triangle',
      'rect',
      'rectRot',
      'cross',
      'star',
      'circle-hollow',
      'triangle-hollow',
      'rect-hollow',
      'rectRot-hollow'
    ];

    function getPointStyleConfig(index, color) {
      const style = POINT_STYLES[index % POINT_STYLES.length];
      if (style === 'circle-hollow') {
        return {
          pointStyle: 'circle',
          pointBackgroundColor: '#ffffff',
          pointBorderColor: color,
          pointBorderWidth: 1.5,
        };
      }
      if (style === 'triangle-hollow') {
        return {
          pointStyle: 'triangle',
          pointBackgroundColor: '#ffffff',
          pointBorderColor: color,
          pointBorderWidth: 1.5,
        };
      }
      if (style === 'rect-hollow') {
        return {
          pointStyle: 'rect',
          pointBackgroundColor: '#ffffff',
          pointBorderColor: color,
          pointBorderWidth: 1.5,
        };
      }
      if (style === 'rectRot-hollow') {
        return {
          pointStyle: 'rectRot',
          pointBackgroundColor: '#ffffff',
          pointBorderColor: color,
          pointBorderWidth: 1.5,
        };
      }
      return {
        pointStyle: style,
        pointBackgroundColor: color,
        pointBorderColor: color,
        pointBorderWidth: 1,
      };
    }

    function parseFileName(raw) {
      return raw.replace(/\.(csv|CSV)$/, '');
    }

    // 將 HH:mm:ss 格式轉換為 HH:mm（只需到分鐘）
    function formatTimeToMinute(timeStr) {
      if (!timeStr) return '';
      const rawTime = timeStr.includes(' ') ? timeStr.split(' ')[1] : timeStr;
      const parts = rawTime.split(':');
      if (parts.length >= 2) {
        return `${parts[0]}:${parts[1]}`;
      }
      return rawTime;
    }

    const defaultSettings = (metric) => ({
      title: `${metric} (mW)`,
      xLabel: 'Time',
      yLabel: `${metric} (mW)`,
      yMin: '',
      yMax: '',
      showAvg: true,
    });

    function SettingsPanel({ settings, onChange }) {
      const field = (label, key) => (
        <label className="flex flex-col gap-1">
          <span className="text-xs text-slate-500 font-medium">{label}</span>
          <input
            type="text"
            value={settings[key]}
            onChange={(e) => onChange({ ...settings, [key]: e.target.value })}
            className="px-2.5 py-1.5 border border-slate-200 rounded-md text-sm text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400 w-full"
          />
        </label>
      );

      return (
        <div className="bg-slate-50 border border-slate-200 rounded-xl p-4">
          <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">圖表設定</p>
          <div className="grid grid-cols-2 gap-3 sm:grid-cols-5 mb-3">
            {field('標題 Title', 'title')}
            {field('X 軸名稱', 'xLabel')}
            {field('Y 軸名稱', 'yLabel')}
            {field('Y 軸最小值', 'yMin')}
            {field('Y 軸最大值', 'yMax')}
          </div>
          <label className="flex items-center gap-2 cursor-pointer select-none">
            <input
              type="checkbox"
              checked={settings.showAvg}
              onChange={(e) => onChange({ ...settings, showAvg: e.target.checked })}
              className="w-4 h-4 accent-blue-600 cursor-pointer"
            />
            <span className="text-xs text-slate-600 font-medium">顯示各檔案平均虛線與圖例數值 (Avg)</span>
            <span className="w-6 h-0.5 rounded-full inline-block ml-1" style={{ borderTop: '1px dashed #64748b', height: 0 }} />
          </label>
        </div>
      );
    }

    function ChartComponent({ chartData, files, settings, activeMetric, onChartInstance }) {
      const canvasRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;

        const labels = chartData.map(d => d.seq);
        const fileAvgMap = {};
        const fileTimeMap = {};

        files.forEach((f) => {
          const validVals = chartData
            .map(d => d[f.name])
            .filter(v => v !== null && v !== undefined && !isNaN(v));
          if (validVals.length > 0) {
            const sum = validVals.reduce((a, b) => a + b, 0);
            fileAvgMap[f.name] = (sum / validVals.length).toFixed(2);
          }

          const firstRowWithTime = f.rows.find(r => r && r.Time);
          if (firstRowWithTime && firstRowWithTime.Time) {
            fileTimeMap[f.name] = formatTimeToMinute(firstRowWithTime.Time);
          }
        });

        const datasets = files.map((f, i) => {
          const styleConfig = getPointStyleConfig(i, COLORS[i % COLORS.length]);
          const avgVal = fileAvgMap[f.name];
          const timeVal = fileTimeMap[f.name];
          const labelTitle = timeVal ? `${f.name} (${timeVal})` : f.name;

          return {
            label: labelTitle,
            data: chartData.map(d => d[f.name]),
            borderColor: COLORS[i % COLORS.length],
            backgroundColor: COLORS[i % COLORS.length],
            borderWidth: 1.5,
            pointStyle: styleConfig.pointStyle,
            pointBackgroundColor: styleConfig.pointBackgroundColor,
            pointBorderColor: styleConfig.pointBorderColor,
            pointBorderWidth: styleConfig.pointBorderWidth,
            pointRadius: 3,
            pointHoverRadius: 4.5,
            tension: 0.1,
            spanGaps: false,
            avgValue: avgVal
          };
        });

        if (settings.showAvg) {
          files.forEach((f, i) => {
            const avg = fileAvgMap[f.name];
            if (avg !== undefined) {
              const avgData = Array(chartData.length).fill(parseFloat(avg));

              datasets.push({
                label: `${f.name} 平均線`,
                data: avgData,
                borderColor: COLORS[i % COLORS.length],
                backgroundColor: COLORS[i % COLORS.length],
                borderWidth: 1,
                borderDash: [4, 4],
                pointStyle: false,
                pointRadius: 0,
                tension: 0,
                spanGaps: true,
                isAvgLine: true
              });
            }
          });
        }

        const yMinParsed = settings.yMin !== '' ? parseFloat(settings.yMin) : undefined;
        const yMaxParsed = settings.yMax !== '' ? parseFloat(settings.yMax) : undefined;

        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
        }

        const ctx = canvasRef.current.getContext('2d');
        const chart = new Chart(ctx, {
          type: 'line',
          data: { labels, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            layout: {
              padding: { bottom: 20, left: 10 }
            },
            interaction: {
              mode: 'index',
              intersect: false,
            },
            plugins: {
              title: {
                display: true,
                text: settings.title,
                font: { size: 14, weight: '600' },
                color: '#334155',
                padding: { bottom: 16 }
              },
              legend: {
                position: 'bottom',
                labels: {
                  boxWidth: 6,
                  boxHeight: 6,
                  usePointStyle: true,
                  font: { size: 12, weight: '500' },
                  color: '#334155',
                  padding: 20,
                  filter: (legendItem, data) => {
                    const dataset = data.datasets[legendItem.datasetIndex];
                    return !dataset.isAvgLine;
                  },
                  generateLabels: (chart) => {
                    const datasets = chart.data.datasets;
                    return datasets
                      .map((dataset, i) => {
                        if (dataset.isAvgLine) return null;

                        let textLabel = dataset.label;
                        if (settings.showAvg && dataset.avgValue !== undefined) {
                          textLabel += `  [Avg: ${dataset.avgValue}]`;
                        }

                        return {
                          text: textLabel,
                          fillStyle: dataset.pointBackgroundColor || dataset.backgroundColor,
                          strokeStyle: dataset.pointBorderColor || dataset.borderColor,
                          lineWidth: dataset.pointBorderWidth || dataset.borderWidth,
                          pointStyle: dataset.pointStyle,
                          hidden: !chart.isDatasetVisible(i),
                          datasetIndex: i,
                          fontColor: '#334155',
                        };
                      })
                      .filter(Boolean);
                  }
                }
              },
              tooltip: {
                backgroundColor: '#ffffff',
                titleColor: '#64748b',
                bodyColor: '#334155',
                borderColor: '#e2e8f0',
                borderWidth: 1,
                padding: 10,
                titleFont: { family: 'monospace', size: 12 },
                bodyFont: { family: 'monospace', size: 12 },
                boxPadding: 4,
                boxWidth: 6,
                usePointStyle: true,
                filter: (tooltipItem) => {
                  return !tooltipItem.dataset.isAvgLine;
                }
              }
            },
            scales: {
              x: {
                grid: { color: '#f1f5f9' },
                ticks: { color: '#94a3b8', font: { family: 'monospace', size: 10 } },
                title: {
                  display: true,
                  text: settings.xLabel,
                  color: '#64748b',
                  font: { size: 12 }
                }
              },
              y: {
                min: yMinParsed,
                max: yMaxParsed,
                afterFit: (scaleInstance) => {
                  scaleInstance.width = Math.max(scaleInstance.width, 80);
                },
                grid: { color: '#f1f5f9' },
                ticks: {
                  color: '#94a3b8',
                  font: { family: 'monospace', size: 11 },
                  padding: 10
                },
                title: {
                  display: true,
                  text: settings.yLabel,
                  color: '#64748b',
                  font: { size: 12 },
                  padding: { bottom: 8 }
                }
              }
            }
          }
        });

        chartInstanceRef.current = chart;
        if (onChartInstance) {
          onChartInstance(chart);
        }

        return () => {
          if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
          }
        };
      }, [chartData, files, settings, activeMetric]);

      return (
        <div className="bg-white border border-slate-200 rounded-xl p-5">
          <div className="relative w-full h-[600px]">
            <canvas ref={canvasRef}></canvas>
          </div>
        </div>
      );
    }

    function App() {
      const [files, setFiles] = useState([]);
      const [activeMetric, setActiveMetric] = useState('Kauai');
      const [dragging, setDragging] = useState(false);
      const [isExporting, setIsExporting] = useState(false);
      const [settingsMap, setSettingsMap] = useState({
        Kauai: defaultSettings('Kauai'),
        AR1: defaultSettings('AR1'),
        AR2: defaultSettings('AR2'),
        total_battery: defaultSettings('total_battery'),
      });
      const inputRef = useRef(null);
      const activeChartRef = useRef(null);

      const loadFiles = useCallback((fileList) => {
        fileList.forEach((file) => {
          const name = parseFileName(file.name);
          Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            complete(result) {
              setFiles((prev) => {
                const filtered = prev.filter((f) => f.name !== name);
                return [...filtered, { name, rows: result.data }].sort((a, b) =>
                  a.name.localeCompare(b.name)
                );
              });
            },
          });
        });
      }, []);

      const onDrop = useCallback(
        (e) => {
          e.preventDefault();
          setDragging(false);
          loadFiles(Array.from(e.dataTransfer.files).filter((f) => /\.csv$/i.test(f.name)));
        },
        [loadFiles]
      );

      const onInputChange = (e) => {
        if (e.target.files) loadFiles(Array.from(e.target.files));
        e.target.value = '';
      };

      // 產生離屏 (Offscreen) 圖表 Base64 圖片供 Excel 使用（包含白底與外框線）
      const generateChartImage = (metric) => {
        return new Promise((resolve) => {
          const canvas = document.createElement('canvas');
          canvas.width = 950;
          canvas.height = 550;
          const ctx = canvas.getContext('2d');

          const maxLen = files.reduce((m, f) => Math.max(m, f.rows.length), 0);
          const labels = Array.from({ length: maxLen }, (_, i) => i + 1);

          const fileAvgMap = {};
          const fileTimeMap = {};
          files.forEach((f) => {
            const validVals = f.rows
              .map(r => r ? Number(r[metric]) : null)
              .filter(v => v !== null && v !== undefined && !isNaN(v));
            if (validVals.length > 0) {
              const sum = validVals.reduce((a, b) => a + b, 0);
              fileAvgMap[f.name] = (sum / validVals.length).toFixed(2);
            }
            const firstRowWithTime = f.rows.find(r => r && r.Time);
            if (firstRowWithTime && firstRowWithTime.Time) {
              fileTimeMap[f.name] = formatTimeToMinute(firstRowWithTime.Time);
            }
          });

          const datasets = files.map((f, i) => {
            const styleConfig = getPointStyleConfig(i, COLORS[i % COLORS.length]);
            const avgVal = fileAvgMap[f.name];
            const timeVal = fileTimeMap[f.name];
            const labelTitle = timeVal ? `${f.name} (${timeVal})` : f.name;

            return {
              label: labelTitle,
              data: Array.from({ length: maxLen }, (_, idx) => {
                const v = f.rows[idx] ? Number(f.rows[idx][metric]) : null;
                return (v !== null && !isNaN(v)) ? v : null;
              }),
              borderColor: COLORS[i % COLORS.length],
              backgroundColor: COLORS[i % COLORS.length],
              borderWidth: 1.5,
              pointStyle: styleConfig.pointStyle,
              pointBackgroundColor: styleConfig.pointBackgroundColor,
              pointBorderColor: styleConfig.pointBorderColor,
              pointBorderWidth: styleConfig.pointBorderWidth,
              pointRadius: 3,
              tension: 0.1,
              spanGaps: false,
              avgValue: avgVal
            };
          });

          const mSettings = settingsMap[metric] || defaultSettings(metric);
          if (mSettings.showAvg) {
            files.forEach((f, i) => {
              const avg = fileAvgMap[f.name];
              if (avg !== undefined) {
                datasets.push({
                  label: `${f.name} 平均線`,
                  data: Array(maxLen).fill(parseFloat(avg)),
                  borderColor: COLORS[i % COLORS.length],
                  backgroundColor: COLORS[i % COLORS.length],
                  borderWidth: 1,
                  borderDash: [4, 4],
                  pointStyle: false,
                  pointRadius: 0,
                  tension: 0,
                  spanGaps: true,
                  isAvgLine: true
                });
              }
            });
          }

          // 自訂 Chart.js 外掛：繪製白底與外框
          const customFramePlugin = {
            id: 'customFramePlugin',
            beforeDraw: (chart) => {
              const { ctx, width, height } = chart;
              ctx.save();
              
              // 1. 純白底色
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, width, height);

              // 2. 灰色外框線 (1px 實線)
              ctx.strokeStyle = '#cbd5e1'; // Slate-300 border
              ctx.lineWidth = 2;
              ctx.strokeRect(1, 1, width - 2, height - 2);

              ctx.restore();
            }
          };

          const chart = new Chart(ctx, {
            type: 'line',
            data: { labels, datasets },
            plugins: [customFramePlugin],
            options: {
              responsive: false,
              animation: false,
              layout: {
                padding: 16
              },
              plugins: {
                title: {
                  display: true,
                  text: mSettings.title,
                  font: { size: 16, weight: 'bold' },
                  color: '#334155',
                },
                legend: {
                  position: 'bottom',
                  labels: {
                    boxWidth: 6,
                    usePointStyle: true,
                    font: { size: 11 },
                    filter: (legendItem, data) => !data.datasets[legendItem.datasetIndex].isAvgLine,
                    generateLabels: (chart) => {
                      return chart.data.datasets
                        .map((ds, idx) => {
                          if (ds.isAvgLine) return null;
                          let txt = ds.label;
                          if (mSettings.showAvg && ds.avgValue !== undefined) {
                            txt += `  [Avg: ${ds.avgValue}]`;
                          }
                          return {
                            text: txt,
                            fillStyle: ds.pointBackgroundColor || ds.backgroundColor,
                            strokeStyle: ds.pointBorderColor || ds.borderColor,
                            lineWidth: ds.pointBorderWidth || ds.borderWidth,
                            pointStyle: ds.pointStyle,
                            datasetIndex: idx,
                          };
                        }).filter(Boolean);
                    }
                  }
                }
              },
              scales: {
                x: { title: { display: true, text: mSettings.xLabel } },
                y: { title: { display: true, text: mSettings.yLabel } }
              }
            }
          });

          setTimeout(() => {
            const base64Image = canvas.toDataURL('image/png');
            chart.destroy();
            resolve(base64Image);
          }, 50);
        });
      };

      // 匯出包含 4 個 Sheet 及右側對應圖表的 Excel 檔案
      const exportToExcel = async () => {
        if (files.length === 0 || isExporting) return;
        setIsExporting(true);

        try {
          const workbook = new ExcelJS.Workbook();
          const maxLen = files.reduce((m, f) => Math.max(m, f.rows.length), 0);

          for (const metric of METRICS) {
            const worksheet = workbook.addWorksheet(metric);

            // 1. 建立數據表頭
            const headers = ['Seq (排序)'];
            files.forEach((f) => {
              headers.push(`Time_${f.name}`);
              headers.push(`${metric}_${f.name}`);
            });
            worksheet.addRow(headers);

            // 表頭樣式
            const headerRow = worksheet.getRow(1);
            headerRow.font = { bold: true };
            headerRow.fill = {
              type: 'pattern',
              pattern: 'solid',
              fgColor: { argb: 'F1F5F9' }
            };

            // 2. 填入數據列
            for (let i = 0; i < maxLen; i++) {
              const rowData = [i + 1];
              files.forEach((f) => {
                const fileRow = f.rows[i];
                const timeVal = fileRow ? formatTimeToMinute(fileRow.Time) : '';
                const rawVal = fileRow ? Number(fileRow[metric]) : null;
                const val = (rawVal !== null && !isNaN(rawVal)) ? rawVal : '';

                rowData.push(timeVal);
                rowData.push(val);
              });
              worksheet.addRow(rowData);
            }

            // 自動調整欄寬
            worksheet.columns.forEach((col) => {
              col.width = 15;
            });

            // 3. 繪製並匯出對應指標圖表（含框線）
            const imgBase64 = await generateChartImage(metric);
            const imageId = workbook.addImage({
              base64: imgBase64,
              extension: 'png',
            });

            const startCol = files.length * 2 + 3;
            worksheet.addImage(imageId, {
              tl: { col: startCol, row: 1 },
              ext: { width: 800, height: 480 }
            });
          }

          // 下載 Excel 檔案
          const buffer = await workbook.xlsx.writeBuffer();
          const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
          const url = window.URL.createObjectURL(blob);
          const anchor = document.createElement('a');
          anchor.href = url;
          anchor.download = `Energy_Monitor_Export_${new Date().toISOString().slice(0, 10)}.xlsx`;
          anchor.click();
          window.URL.revokeObjectURL(url);
        } catch (err) {
          console.error("Excel export error:", err);
          alert("匯出 Excel 時發生錯誤");
        } finally {
          setIsExporting(false);
        }
      };

      const settings = settingsMap[activeMetric];
      const setSettings = (s) =>
        setSettingsMap((prev) => ({ ...prev, [activeMetric]: s }));

      const maxLen = files.reduce((m, f) => Math.max(m, f.rows.length), 0);

      const chartData = Array.from({ length: maxLen }, (_, i) => {
        const point = {
          seq: i + 1,
        };
        files.forEach((f) => {
          const v = f.rows[i] ? Number(f.rows[i][activeMetric]) : null;
          point[f.name] = (v !== null && !isNaN(v)) ? v : null;
        });
        return point;
      });

      const tableRows = Array.from({ length: maxLen }, (_, i) => i);

      return (
        <div className="min-h-screen bg-white text-slate-800 font-sans">
          {/* Header */}
          <header className="border-b border-slate-200 px-6 py-4 flex items-center gap-4 bg-white">
            <div>
              <h1 className="text-base font-semibold tracking-tight text-slate-900">Energy Monitor</h1>
              <p className="text-xs text-slate-400 font-mono mt-0.5">Multi-file CSV Aggregator</p>
            </div>
            <div className="ml-auto flex items-center gap-3">
              {files.length > 0 && (
                <>
                  <span className="text-xs text-slate-400 font-mono">{files.length} 個檔案</span>
                  <button
                    onClick={exportToExcel}
                    disabled={isExporting}
                    className={`px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium rounded-md transition-colors flex items-center gap-1.5 ${
                      isExporting ? 'opacity-50 cursor-not-allowed' : ''
                    }`}
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    {isExporting ? '匯出中...' : '匯出 Excel (含圖表與4Sheet)'}
                  </button>
                </>
              )}
              <button
                onClick={() => inputRef.current?.click()}
                className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium rounded-md transition-colors"
              >
                新增 CSV 檔案
              </button>
              {files.length > 0 && (
                <button
                  onClick={() => setFiles([])}
                  className="px-3 py-1.5 border border-slate-200 hover:border-slate-400 text-slate-500 hover:text-slate-700 text-xs rounded-md transition-colors"
                >
                  清除全部
                </button>
              )}
              <input ref={inputRef} type="file" accept=".csv" multiple className="hidden" onChange={onInputChange} />
            </div>
          </header>

          {files.length === 0 ? (
            <div
              className="flex flex-col items-center justify-center min-h-[calc(100vh-65px)] p-8"
              onDragOver={(e) => { e.preventDefault(); setDragging(true); }}
              onDragLeave={() => setDragging(false)}
              onDrop={onDrop}
            >
              <div
                className={`w-full max-w-lg border-2 border-dashed rounded-xl p-16 text-center transition-colors cursor-pointer ${
                  dragging ? 'border-blue-400 bg-blue-50' : 'border-slate-200 hover:border-blue-300'
                }`}
                onClick={() => inputRef.current?.click()}
              >
                <div className="text-4xl mb-4 text-slate-300">↑</div>
                <p className="text-slate-700 font-medium mb-1">拖曳或點擊上傳 CSV 檔案</p>
                <p className="text-slate-400 text-sm">
                  例如 <span className="font-mono text-slate-500">EM4_1-6_BS1.csv</span>、<span className="font-mono text-slate-500">EM4_2-9_BS2.csv</span>
                </p>
                <p className="text-slate-300 text-xs mt-4 font-mono">Kauai · AR1 · AR2 · total_battery</p>
              </div>
            </div>
          ) : (
            <div className="flex flex-col">
              {/* Metric tabs */}
              <nav className="flex gap-1 px-6 pt-4 border-b border-slate-200 bg-white">
                {METRICS.map((m) => (
                  <button
                    key={m}
                    onClick={() => setActiveMetric(m)}
                    className={`px-4 py-2 text-sm font-medium rounded-t-md transition-colors font-mono ${
                      activeMetric === m
                        ? 'bg-white text-blue-600 border-t border-x border-slate-200 -mb-px'
                        : 'text-slate-400 hover:text-slate-600'
                    }`}
                  >
                    {m}
                  </button>
                ))}
              </nav>

              <div className="px-6 py-5 space-y-5">
                {/* Settings panel */}
                <SettingsPanel settings={settings} onChange={setSettings} />

                {/* File legend */}
                <div className="flex flex-wrap gap-3">
                  {files.map((f, i) => (
                    <div key={f.name} className="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-md px-2.5 py-1">
                      <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ background: COLORS[i % COLORS.length] }} />
                      <span className="text-xs font-mono text-slate-600">{f.name}</span>
                      <button
                        onClick={() => setFiles((prev) => prev.filter((p) => p.name !== f.name))}
                        className="text-slate-300 hover:text-red-400 text-sm leading-none transition-colors ml-0.5"
                        title="移除"
                      >×</button>
                    </div>
                  ))}
                </div>

                {/* Chart */}
                <ChartComponent
                  chartData={chartData}
                  files={files}
                  settings={settings}
                  activeMetric={activeMetric}
                  onChartInstance={(chart) => { activeChartRef.current = chart; }}
                />

                {/* Interleaved table */}
                <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
                  <div className="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
                    <div>
                      <h2 className="text-sm font-semibold text-slate-700 font-mono">
                        資料表 — {activeMetric}
                      </h2>
                      <p className="text-xs text-slate-400 font-mono mt-0.5">
                        欄位：Seq, Time_&#123;file&#125;, {activeMetric}_&#123;file&#125; × {files.length} 個檔案
                      </p>
                    </div>
                  </div>
                  <div className="overflow-auto max-h-96">
                    <table className="w-full text-xs font-mono border-collapse">
                      <thead className="sticky top-0 bg-slate-50">
                        <tr>
                          <th className="px-3 py-2 text-left text-slate-400 font-medium border-r border-slate-200 whitespace-nowrap bg-slate-100">
                            Seq (排序)
                          </th>
                          {files.map((f, i) => (
                            <React.Fragment key={f.name}>
                              <th
                                className="px-3 py-2 text-left text-slate-400 font-medium border-r border-slate-100 whitespace-nowrap"
                                style={{ borderLeft: i > 0 ? '2px solid #f1f5f9' : undefined }}
                              >
                                Time_{f.name}
                              </th>
                              <th
                                className="px-3 py-2 text-right border-r border-slate-100 whitespace-nowrap font-semibold"
                                style={{ color: COLORS[i % COLORS.length] }}
                              >
                                {activeMetric}_{f.name}
                              </th>
                            </React.Fragment>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {tableRows.map((i) => (
                          <tr key={i} className="border-t border-slate-50 hover:bg-slate-50 transition-colors">
                            <td className="px-3 py-1.5 text-slate-500 font-bold border-r border-slate-200 bg-slate-50/50 whitespace-nowrap tabular-nums">
                              {i + 1}
                            </td>
                            {files.map((f, fi) => {
                              const row = f.rows[i];
                              return (
                                <React.Fragment key={`${f.name}-${i}`}>
                                  <td
                                    className="px-3 py-1.5 text-slate-400 border-r border-slate-100 whitespace-nowrap tabular-nums"
                                    style={{ borderLeft: fi > 0 ? '2px solid #f1f5f9' : undefined }}
                                  >
                                    {row ? formatTimeToMinute(row.Time) : '—'}
                                  </td>
                                  <td
                                    className="px-3 py-1.5 text-right border-r border-slate-100 tabular-nums"
                                    style={{ color: row ? COLORS[fi % COLORS.length] : '#cbd5e1' }}
                                  >
                                    {row ? row[activeMetric] : '—'}
                                  </td>
                                </React.Fragment>
                              );
                            })}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

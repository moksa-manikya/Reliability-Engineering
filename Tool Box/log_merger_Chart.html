<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Log 整合與圖表繪製一體化工具</title>
    
    <!-- 樣式與繪圖套件 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS 用於快速解析 CSV/Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- ExcelJS 用於處理帶有圖片與樣式的 Excel 寫入 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>

    <style>
        .upload-area {
            border: 2px dashed #cbd5e1;
            transition: all 0.2s ease;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #2563eb;
            background-color: #eff6ff;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 sm:p-8 flex flex-col items-center">

    <div class="w-full max-w-6xl space-y-6">
        
        <!-- 步驟 1: 多檔案上傳與欄位整合區塊 -->
        <div class="bg-white p-6 rounded-2xl shadow-xl border border-gray-100">
            <h1 class="text-2xl font-bold text-gray-800 mb-2 flex items-center gap-2">
                <span>📁</span> 步驟 1：Power Log 多檔案合併與欄位拆分
            </h1>
            <p class="text-sm text-gray-500 mb-4">
                上傳多個 <code>power_log_xxx</code> 檔案，自訂勾選欄位並轉換時間為 24 小時制（HH:mm:ss）[cite: 1]。
            </p>

            <div class="upload-area bg-slate-50 p-6 rounded-xl text-center cursor-pointer mb-4" id="dropZone" onclick="document.getElementById('fileInput').click()">
                <div class="text-3xl mb-1">📂</div>
                <div class="font-semibold text-gray-700 text-sm">點擊或拖曳多個 Excel / CSV 檔案至此處</div>
                <div class="text-xs text-gray-400">支援格式：.xlsx, .xls, .csv</div>
            </div>
            <input type="file" id="fileInput" multiple accept=".xlsx, .xls, .csv" class="hidden">

            <!-- 檔案清單 -->
            <div id="fileListContainer" class="hidden mb-4 p-3 bg-gray-50 rounded-lg border border-gray-200">
                <div class="text-xs font-semibold text-gray-600 mb-2">已選擇的檔案：</div>
                <div class="max-h-32 overflow-y-auto space-y-1 text-xs" id="fileList"></div>
            </div>

            <!-- 欄位選擇 -->
            <div id="columnSelectContainer" class="hidden mb-4 p-3 bg-gray-50 rounded-lg border border-gray-200">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-semibold text-gray-600">選擇要匯整的數據欄位：</span>
                    <div class="text-xs text-blue-600">
                        <span class="cursor-pointer hover:underline" onclick="toggleSelectAll(true)">全選</span> | 
                        <span class="cursor-pointer hover:underline" onclick="toggleSelectAll(false)">全不選</span>
                    </div>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-2 max-h-36 overflow-y-auto pt-1" id="columnGrid"></div>
            </div>

            <button id="processBtn" disabled onclick="processAndTransferData()" 
                    class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 text-white font-semibold py-2.5 rounded-lg transition text-sm shadow">
                ⚡ 開始整合並載入至圖表分析系統
            </button>

            <div id="statusMsg" class="mt-3 p-3 rounded-lg text-xs hidden"></div>
        </div>

        <!-- 步驟 2: 全域控制面板與圖表匯出區塊 -->
        <div id="chartSection" class="bg-white p-6 rounded-2xl shadow-xl border border-gray-100 hidden">
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                <span>📊</span> 步驟 2：圖表生成、參數微調與 Excel 回存
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 bg-slate-50 p-4 rounded-xl border border-gray-200">
                <!-- 預設軸標題 -->
                <div class="space-y-1.5 border-r md:border-gray-200 pr-0 md:pr-4">
                    <span class="block font-medium text-blue-700 text-xs">全域預設軸標題：</span>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label for="xAxisTitleInput" class="block text-[11px] text-gray-600">X 軸預設：</label>
                            <input type="text" id="xAxisTitleInput" value="Time" class="w-full border rounded px-2 py-1 text-xs bg-white">
                        </div>
                        <div>
                            <label for="yAxisTitleInput" class="block text-[11px] text-gray-600">Y 軸預設：</label>
                            <input type="text" id="yAxisTitleInput" value="Power Value (vW)" class="w-full border rounded px-2 py-1 text-xs bg-white">
                        </div>
                    </div>
                </div>

                <!-- 統一 Y 軸範圍 -->
                <div class="space-y-1.5 border-r md:border-gray-200 pr-0 md:pr-4">
                    <span class="block font-medium text-blue-700 text-xs">統一調整所有 Y 軸範圍：</span>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <input type="number" step="any" id="globalYMin" placeholder="Y 最小值 (自動)" class="w-full border rounded px-2 py-1 text-xs bg-white">
                        </div>
                        <div>
                            <input type="number" step="any" id="globalYMax" placeholder="Y 最大值 (自動)" class="w-full border rounded px-2 py-1 text-xs bg-white">
                        </div>
                    </div>
                    <button onclick="applyGlobalYLimits()" 
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-1 rounded transition text-xs">
                        套用 Y 軸範圍至所有圖表
                    </button>
                </div>

                <!-- 下載匯出按鈕 -->
                <div class="flex items-end">
                    <button id="exportBtn" onclick="exportExcelWithCharts()" 
                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition text-xs shadow flex items-center justify-center gap-1">
                        📥 下載整合好的完整 Excel (.xlsx)
                    </button>
                </div>
            </div>
        </div>

        <!-- 圖表呈現區域 -->
        <div id="chartsContainer" class="space-y-6"></div>

    </div>

    <script>
        // 全域變數狀態
        let selectedFiles = [];
        let parsedFilesData = [];
        let consolidatedWorkbookBuffer = null; 
        let rawWorkbookData = [];  
        let chartInstances = [];   
        let exportFileName = 'power_log_consolidated_with_charts.xlsx';

        const colorPaletteHex = ['#3b82f6', '#f97316', '#22c55e', '#a855f7', '#ec4899', '#00FFFF', '#eab308', '#ef4444', '#6366f1'];
        const shapePalette = ['circle', 'triangle', 'rect', 'rectRot', 'cross'];

        // --- 拖動與檔案選擇事件 handler ---
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function extractTag(filename) {
            let name = filename.replace(/\.(xlsx|xls|csv)$/i, '');
            return name.startsWith('power_log_') ? name.replace('power_log_', '') : name;
        }

        async function handleFiles(files) {
            const validFiles = Array.from(files).filter(f => {
                const lower = f.name.toLowerCase();
                return lower.endsWith('.xlsx') || lower.endsWith('.xls') || lower.endsWith('.csv');
            });
            if (validFiles.length === 0) return;

            selectedFiles = validFiles;
            selectedFiles.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));

            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';
            selectedFiles.forEach(file => {
                const tag = extractTag(file.name);
                fileList.innerHTML += `
                    <div class="flex justify-between items-center bg-white p-1.5 rounded border border-gray-200">
                        <span class="font-medium text-gray-700">${file.name}</span>
                        <span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-[10px] font-bold">${tag}</span>
                    </div>`;
            });
            document.getElementById('fileListContainer').classList.remove('hidden');

            showStatus('正在預解析檔案欄位...', '');
            await parseUploadedFiles();
        }

        async function parseUploadedFiles() {
            parsedFilesData = [];
            const allMetricKeys = new Set();

            try {
                for (const file of selectedFiles) {
                    const tag = extractTag(file.name);
                    const arrayBuffer = await file.arrayBuffer();
                    const workbook = XLSX.read(arrayBuffer, { type: 'array', cellDates: true });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

                    if (jsonData.length > 0) {
                        Object.keys(jsonData[0]).forEach(key => {
                            if (key.trim().toLowerCase() !== 'time') {
                                allMetricKeys.add(key.trim());
                            }
                        });
                    }

                    parsedFilesData.push({ fileName: file.name, tag, rows: jsonData });
                }

                const columnGrid = document.getElementById('columnGrid');
                columnGrid.innerHTML = '';
                if (allMetricKeys.size === 0) {
                    showStatus('警告：未在檔案中找到可用的數據欄位', 'error');
                    document.getElementById('processBtn').disabled = true;
                    return;
                }

                allMetricKeys.forEach(metric => {
                    columnGrid.innerHTML += `
                        <label class="flex items-center gap-1.5 bg-white p-1.5 rounded border border-gray-200 text-xs cursor-pointer hover:bg-slate-50">
                            <input type="checkbox" name="metricColumn" value="${metric}" checked class="rounded text-blue-600">
                            <span class="truncate">${metric}</span>
                        </label>`;
                });

                document.getElementById('columnSelectContainer').classList.remove('hidden');
                document.getElementById('processBtn').disabled = false;
                showStatus('', '');

            } catch (error) {
                console.error(error);
                showStatus(`檔案讀取失敗：${error.message}`, 'error');
            }
        }

        function toggleSelectAll(checked) {
            document.querySelectorAll('input[name="metricColumn"]').forEach(cb => cb.checked = checked);
        }

        function showStatus(text, type) {
            const statusMsg = document.getElementById('statusMsg');
            if (!text) {
                statusMsg.classList.add('hidden');
                return;
            }
            statusMsg.className = 'mt-3 p-3 rounded-lg text-xs ' + (type === 'error' ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-800');
            statusMsg.innerText = text;
            statusMsg.classList.remove('hidden');
        }

        // --- 24小時制時間轉換邏輯 ---
        function formatTo24HourTime(val) {
            if (val === null || val === undefined || val === '') return '';
            if (val instanceof Date) return formatDateObj(val);

            if (typeof val === 'number') {
                if (val >= 0 && val < 1) {
                    let totalSeconds = Math.round(val * 86400);
                    let hours = Math.floor(totalSeconds / 3600);
                    let minutes = Math.floor((totalSeconds % 3600) / 60);
                    let seconds = totalSeconds % 60;
                    return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                } else {
                    const dateObj = XLSX.SSF.parse_date_code(val);
                    if (dateObj) {
                        const h = String(dateObj.H || 0).padStart(2, '0');
                        const m = String(dateObj.M || 0).padStart(2, '0');
                        const s = String(dateObj.S || 0).padStart(2, '0');
                        return `${h}:${m}:${s}`;
                    }
                }
            }

            let strVal = String(val).trim();
            const ampmMatch = strVal.match(/^(?:(\d{4}[-\/]\d{1,2}[-\/]\d{1,2})\s+)?(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM|上午|下午)$/i);
            if (ampmMatch) {
                let hours = parseInt(ampmMatch[2], 10);
                let minutes = ampmMatch[3];
                let seconds = ampmMatch[4] || '00';
                let period = ampmMatch[5].toUpperCase();
                if ((period === 'PM' || period === '下午') && hours < 12) hours += 12;
                if ((period === 'AM' || period === '上午') && hours === 12) hours = 0;
                return `${String(hours).padStart(2, '0')}:${minutes}:${seconds}`;
            }

            const hmsMatch = strVal.match(/^(?:(\d{4}[-\/]\d{1,2}[-\/]\d{1,2})\s+)?(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
            if (hmsMatch) {
                return `${String(parseInt(hmsMatch[2], 10)).padStart(2, '0')}:${hmsMatch[3]}:${hmsMatch[4] || '00'}`;
            }

            return strVal;
        }

        function formatDateObj(d) {
            return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
        }

        // --- 階段 1 到 階段 2 的資料處理與銜接 ---
        async function processAndTransferData() {
            const selectedColumns = Array.from(document.querySelectorAll('input[name="metricColumn"]:checked')).map(cb => cb.value);
            if (selectedColumns.length === 0) {
                showStatus('請至少勾選一個要匯整的欄位！', 'error');
                return;
            }

            showStatus('正在合併數據並傳送至圖表繪製模組...', 'success');

            try {
                const newWorkbook = XLSX.utils.book_new();

                selectedColumns.forEach(metric => {
                    const headerRow = [];
                    parsedFilesData.forEach(fileObj => {
                        headerRow.push('Time');
                        headerRow.push(`${metric}_${fileObj.tag}`);
                    });

                    let maxRows = Math.max(...parsedFilesData.map(f => f.rows.length));
                    const sheetData = [headerRow];

                    for (let r = 0; r < maxRows; r++) {
                        const rowData = [];
                        parsedFilesData.forEach(fileObj => {
                            const row = fileObj.rows[r];
                            if (row) {
                                const rawTimeVal = row['Time'] !== undefined ? row['Time'] : (row['time'] !== undefined ? row['time'] : '');
                                rowData.push(formatTo24HourTime(rawTimeVal));
                                rowData.push(row[metric] !== undefined ? row[metric] : '');
                            } else {
                                rowData.push('');
                                rowData.push('');
                            }
                        });
                        sheetData.push(rowData);
                    }

                    const newSheet = XLSX.utils.aoa_to_sheet(sheetData);
                    const cleanSheetName = metric.replace(/[\/?*\[\]]/g, '_').substring(0, 31);
                    XLSX.utils.book_append_sheet(newWorkbook, newSheet, cleanSheetName);
                });

                // 將 SheetJS 的結果導出為 ArrayBuffer 供 ExcelJS 使用
                const arrayBuffer = XLSX.write(newWorkbook, { bookType: 'xlsx', type: 'array' });
                consolidatedWorkbookBuffer = arrayBuffer;

                // 初始化階段 2 (圖表生成)
                await initChartEngine();

                document.getElementById('chartSection').classList.remove('hidden');
                showStatus('✅ 資料整合完畢，已成功為每個 Sheet 生成圖表！', 'success');

            } catch (error) {
                console.error(error);
                showStatus(`整合失敗：${error.message}`, 'error');
            }
        }

        // --- 階段 2: 圖表繪製與管理 logic ---
        async function initChartEngine() {
            const wb = new ExcelJS.Workbook();
            await wb.xlsx.load(consolidatedWorkbookBuffer);

            destroyAllCharts();
            const container = document.getElementById('chartsContainer');
            container.innerHTML = '';
            rawWorkbookData = [];

            wb.eachSheet((worksheet) => {
                const sheetName = worksheet.name;
                const rows = [];
                worksheet.eachRow({ includeEmpty: false }, (row) => {
                    const rowValues = [];
                    row.eachCell({ includeEmpty: true }, (cell, colNumber) => {
                        rowValues[colNumber - 1] = cell.value;
                    });
                    rows.push(rowValues);
                });
                rawWorkbookData.push({ sheetName, rows });
            });

            rawWorkbookData.forEach((data, index) => {
                createSheetChartCard(data.sheetName, index);
            });
        }

        function destroyAllCharts() {
            chartInstances.forEach(item => { if (item.chart) item.chart.destroy(); });
            chartInstances = [];
        }

        function parseExcelTimeValue(val) {
            if (val === null || val === undefined) return '';
            let strVal = String(val).trim();
            if (/^\d{2}:\d{2}:\d{2}$/.test(strVal)) return strVal.substring(0, 5);
            return strVal;
        }

        function createSheetChartCard(sheetName, index) {
            const sheetData = rawWorkbookData.find(d => d.sheetName === sheetName);
            if (!sheetData || !sheetData.rows || sheetData.rows.length < 2) return;

            const rows = sheetData.rows;
            const headerCols = rows[0] || [];
            const maxCols = Math.max(...rows.map(r => r ? r.length : 0));
            const runCount = Math.max(1, Math.floor(maxCols / 2));

            const container = document.getElementById('chartsContainer');
            const card = document.createElement('div');
            card.className = "bg-white p-6 rounded-2xl shadow-lg flex flex-col md:flex-row gap-6 border border-gray-100";
            card.id = `sheet-card-${index}`;

            const globalMin = document.getElementById('globalYMin').value;
            const globalMax = document.getElementById('globalYMax').value;
            const defaultXTitle = document.getElementById('xAxisTitleInput').value.trim() || 'Time';
            const defaultYTitle = document.getElementById('yAxisTitleInput').value.trim() || 'Power Value (vW)';
            const defaultChartTitle = `${sheetName} Power (vW)`;

            let runsInputsHtml = '';
            for (let r = 0; r < runCount; r++) {
                const defaultColor = colorPaletteHex[r % colorPaletteHex.length];
                const defaultShape = shapePalette[r % shapePalette.length];

                runsInputsHtml += `
                    <div class="p-2 border border-gray-200 rounded-lg bg-white space-y-1.5">
                        <div class="flex items-center gap-2">
                            <input type="text" id="run_${index}_${r}" placeholder="測試 ${r + 1}" class="w-1/2 border rounded px-2 py-1 text-xs">
                            <input type="text" id="time_${index}_${r}" placeholder="時間 ${r + 1}" class="w-1/2 border rounded px-2 py-1 text-center text-xs">
                        </div>
                        <div class="flex items-center justify-between gap-2 pt-0.5">
                            <div class="flex items-center gap-1">
                                <label class="text-gray-500 text-[11px]">圖示:</label>
                                <select id="shape_${index}_${r}" class="border rounded px-1 py-0.5 text-xs bg-gray-50">
                                    <option value="circle" ${defaultShape === 'circle' ? 'selected' : ''}>● 圓形</option>
                                    <option value="triangle" ${defaultShape === 'triangle' ? 'selected' : ''}>▲ 三角</option>
                                    <option value="rect" ${defaultShape === 'rect' ? 'selected' : ''}>■ 正方</option>
                                    <option value="rectRot" ${defaultShape === 'rectRot' ? 'selected' : ''}>◆ 菱形</option>
                                    <option value="cross" ${defaultShape === 'cross' ? 'selected' : ''}>┼ 十字</option>
                                </select>
                            </div>
                            <div class="flex items-center gap-1">
                                <label class="text-gray-500 text-[11px]">顏色:</label>
                                <input type="color" id="color_${index}_${r}" value="${defaultColor}" class="w-7 h-6 p-0 border rounded cursor-pointer">
                            </div>
                        </div>
                    </div>`;
            }

            card.innerHTML = `
                <!-- 左側控制面板 -->
                <div class="w-full md:w-1/3 flex flex-col gap-3 bg-gray-50 p-4 rounded-xl border border-gray-200 text-xs">
                    <div class="font-bold text-sm text-gray-800 border-b border-gray-200 pb-2 flex justify-between items-center">
                        <span>Sheet: ${sheetName}</span>
                        <span class="text-xs font-normal text-blue-600 bg-blue-50 px-2 py-0.5 rounded">${runCount} 組數據</span>
                    </div>

                    <div class="space-y-1.5 border-b border-gray-200 pb-2">
                        <div class="font-medium text-gray-700">獨立標題與軸名稱設定：</div>
                        <div>
                            <label class="text-gray-500 block">圖表標題 (Title)：</label>
                            <input type="text" id="chartTitle_${index}" value="${defaultChartTitle}" class="w-full border rounded px-2 py-1 bg-white">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-gray-500 block">X 軸標題：</label>
                                <input type="text" id="xTitle_${index}" value="${defaultXTitle}" class="w-full border rounded px-2 py-1 bg-white">
                            </div>
                            <div>
                                <label class="text-gray-500 block">Y 軸標題：</label>
                                <input type="text" id="yTitle_${index}" value="${defaultYTitle}" class="w-full border rounded px-2 py-1 bg-white">
                            </div>
                        </div>
                    </div>

                    <div class="space-y-1.5 border-b border-gray-200 pb-2">
                        <div class="font-medium text-gray-600">測試項目樣式設定：</div>
                        <div class="max-h-52 overflow-y-auto space-y-2 pr-1">${runsInputsHtml}</div>
                    </div>

                    <div class="space-y-1.5">
                        <div class="font-medium text-gray-700">Y 軸與平均線設定：</div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-gray-500 block">Y 最小值：</label>
                                <input type="number" step="any" id="yMin_${index}" value="${globalMin}" placeholder="自動" class="w-full border rounded px-2 py-1 bg-white">
                            </div>
                            <div>
                                <label class="text-gray-500 block">Y 最大值：</label>
                                <input type="number" step="any" id="yMax_${index}" value="${globalMax}" placeholder="自動" class="w-full border rounded px-2 py-1 bg-white">
                            </div>
                        </div>
                        <div class="flex items-center gap-2 pt-1">
                            <input type="checkbox" id="showAvg_${index}" checked class="rounded text-blue-600 border-gray-300">
                            <label for="showAvg_${index}" class="text-xs text-gray-700 font-medium cursor-pointer">顯示平均線 (Average Line)</label>
                        </div>
                    </div>

                    <button onclick="drawSingleSheetChart('${sheetName}', ${index})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-1.5 rounded transition mt-2">
                        更新此圖表
                    </button>
                </div>

                <!-- 右側圖表畫布 -->
                <div class="w-full md:w-2/3 flex flex-col">
                    <div class="border border-gray-200 rounded-xl p-4 bg-white relative flex flex-col">
                        <div class="h-[380px] relative min-h-0">
                            <canvas id="canvas_${index}"></canvas>
                        </div>
                        <div id="legend_${index}" class="mt-4 pt-3 border-t border-gray-100 flex flex-wrap gap-x-6 gap-y-2 text-xs font-medium text-gray-700"></div>
                    </div>
                </div>`;

            container.appendChild(card);
            drawSingleSheetChart(sheetName, index);
        }

        const whiteBackgroundPlugin = {
            id: 'customCanvasBackgroundColor',
            beforeDraw: (chart) => {
                const { ctx } = chart;
                ctx.save();
                ctx.globalCompositeOperation = 'destination-over';
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, chart.width, chart.height);
                ctx.restore();
            }
        };

        function drawSingleSheetChart(sheetName, index) {
            const sheetData = rawWorkbookData.find(d => d.sheetName === sheetName);
            if (!sheetData) return;
            const rows = sheetData.rows;
            if (!rows || rows.length < 2) return;

            const headerCols = rows[0] || [];
            const firstDataCols = rows[1] || [];
            const maxCols = Math.max(...rows.map(r => r ? r.length : 0));
            const runCount = Math.max(1, Math.floor(maxCols / 2));

            const datasetsData = Array.from({ length: runCount }, () => []);

            for (let r = 0; r < runCount; r++) {
                const runInput = document.getElementById(`run_${index}_${r}`);
                const timeInput = document.getElementById(`time_${index}_${r}`);
                if (runInput && !runInput.value) {
                    runInput.value = headerCols[r * 2 + 1] ? String(headerCols[r * 2 + 1]).trim() : `測試 ${r + 1}`;
                }
                if (timeInput && !timeInput.value) {
                    timeInput.value = parseExcelTimeValue(firstDataCols[r * 2]);
                }
            }

            for (let i = 1; i < rows.length; i++) {
                const columns = rows[i];
                if (!columns || columns.length === 0) continue;
                for (let r = 0; r < runCount; r++) {
                    const valIdx = r * 2 + 1;
                    if (columns.length > valIdx) {
                        const val = parseFloat(columns[valIdx]);
                        if (!isNaN(val)) datasetsData[r].push({ x: datasetsData[r].length + 1, y: val });
                    }
                }
            }

            const chartDatasets = [];
            const showAvg = document.getElementById(`showAvg_${index}`).checked;

            for (let r = 0; r < runCount; r++) {
                const runName = document.getElementById(`run_${index}_${r}`).value.trim() || `測試 ${r + 1}`;
                const runTime = document.getElementById(`time_${index}_${r}`).value.trim();
                const shape = document.getElementById(`shape_${index}_${r}`)?.value || shapePalette[r % shapePalette.length];
                const color = document.getElementById(`color_${index}_${r}`)?.value || colorPaletteHex[r % colorPaletteHex.length];

                const dataset = datasetsData[r];
                const calcAvg = dataset.length > 0 ? (dataset.reduce((sum, d) => sum + d.y, 0) / dataset.length) : null;
                const label = runName + (runTime ? ` (${runTime})` : '');

                chartDatasets.push({
                    label, data: dataset, borderColor: color, backgroundColor: color,
                    borderWidth: 2, pointStyle: shape, pointRadius: 2.5, pointHoverRadius: 4,
                    avgValue: calcAvg, runIndex: r
                });
            }

            if (showAvg) {
                for (let r = 0; r < runCount; r++) {
                    const mainDataset = chartDatasets[r];
                    const avg = mainDataset.avgValue;
                    const len = mainDataset.data.length;
                    if (avg !== null && len > 0) {
                        chartDatasets.push({
                            label: `${mainDataset.label} Avg Line`,
                            data: [{ x: 1, y: avg }, { x: len, y: avg }],
                            borderColor: mainDataset.borderColor, borderWidth: 1.5, borderDash: [5, 5],
                            pointRadius: 0, isAvgLine: true, parentIndex: r
                        });
                    }
                }
            }

            const chartTitle = document.getElementById(`chartTitle_${index}`).value.trim();
            const xAxisTitle = document.getElementById(`xTitle_${index}`).value.trim() || 'Time';
            const yAxisTitle = document.getElementById(`yTitle_${index}`).value.trim() || 'Power Value (vW)';

            const yMin = document.getElementById(`yMin_${index}`).value;
            const yMax = document.getElementById(`yMax_${index}`).value;

            const yScaleConfig = { title: { display: true, text: yAxisTitle } };
            if (yMin !== '') yScaleConfig.min = parseFloat(yMin);
            if (yMax !== '') yScaleConfig.max = parseFloat(yMax);

            const existingIndex = chartInstances.findIndex(item => item.index === index);
            if (existingIndex !== -1) {
                chartInstances[existingIndex].chart.destroy();
                chartInstances.splice(existingIndex, 1);
            }

            const ctx = document.getElementById(`canvas_${index}`).getContext('2d');
            const newChart = new Chart(ctx, {
                type: 'line',
                data: { datasets: chartDatasets },
                plugins: [whiteBackgroundPlugin],
                options: {
                    responsive: true, maintainAspectRatio: false, animation: false,
                    plugins: {
                        title: { display: true, text: chartTitle, font: { size: 14 } },
                        legend: { display: false }
                    },
                    scales: {
                        x: { type: 'linear', title: { display: true, text: xAxisTitle }, ticks: { stepSize: 1 } },
                        y: yScaleConfig
                    }
                }
            });

            chartInstances.push({ index, sheetName, chart: newChart, canvasId: `canvas_${index}`, runCount });
            renderCustomLeftAlignedLegend(newChart, `legend_${index}`, runCount);
        }

        function drawMarkerShape(ctx, shape, x, y, size, color) {
            ctx.save(); ctx.fillStyle = color; ctx.strokeStyle = color; ctx.beginPath();
            if (shape === 'triangle') {
                ctx.moveTo(x, y - size); ctx.lineTo(x - size, y + size); ctx.lineTo(x + size, y + size); ctx.closePath(); ctx.fill();
            } else if (shape === 'rect') {
                ctx.fillRect(x - size, y - size, size * 2, size * 2);
            } else if (shape === 'rectRot') {
                ctx.moveTo(x, y - size); ctx.lineTo(x + size, y); ctx.lineTo(x, y + size); ctx.lineTo(x - size, y); ctx.closePath(); ctx.fill();
            } else if (shape === 'cross') {
                ctx.lineWidth = 1; ctx.moveTo(x - size, y); ctx.lineTo(x + size, y); ctx.moveTo(x, y - size); ctx.lineTo(x, y + size); ctx.stroke();
            } else {
                ctx.arc(x, y, size, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }

        function renderCustomLeftAlignedLegend(chart, containerId, runCount) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';

            chart.data.datasets.forEach((dataset, idx) => {
                if (dataset.isAvgLine) return;
                const isVisible = chart.isDatasetVisible(idx);

                const itemBox = document.createElement('div');
                itemBox.className = `flex items-start gap-2 cursor-pointer transition-opacity duration-200 ${isVisible ? 'opacity-100' : 'opacity-30 line-through'}`;
                itemBox.onclick = () => {
                    const nextVisible = !chart.isDatasetVisible(idx);
                    chart.setDatasetVisibility(idx, nextVisible);
                    const avgLineIdx = chart.data.datasets.findIndex(ds => ds.isAvgLine && ds.parentIndex === idx);
                    if (avgLineIdx !== -1) chart.setDatasetVisibility(avgLineIdx, nextVisible);
                    chart.update();
                    renderCustomLeftAlignedLegend(chart, containerId, runCount);
                };

                const legendCanvas = document.createElement('canvas');
                legendCanvas.width = 14; legendCanvas.height = 14;
                legendCanvas.className = 'mt-0.5 flex-shrink-0';
                drawMarkerShape(legendCanvas.getContext('2d'), dataset.pointStyle || 'circle', 7, 7, 3.5, dataset.borderColor);

                const textGroup = document.createElement('div');
                textGroup.className = 'flex flex-col text-left leading-tight';
                textGroup.innerHTML = `
                    <span class="font-semibold text-gray-800">${dataset.label}</span>
                    <span class="text-xs font-bold text-gray-500 mt-0.5">${dataset.avgValue !== null ? `Avg: ${dataset.avgValue.toFixed(2)}` : 'Avg: N/A'}</span>`;

                itemBox.appendChild(legendCanvas);
                itemBox.appendChild(textGroup);
                container.appendChild(itemBox);
            });
        }

        function applyGlobalYLimits() {
            const globalMin = document.getElementById('globalYMin').value;
            const globalMax = document.getElementById('globalYMax').value;
            rawWorkbookData.forEach((data, index) => {
                const yMinInput = document.getElementById(`yMin_${index}`);
                const yMaxInput = document.getElementById(`yMax_${index}`);
                if (yMinInput) yMinInput.value = globalMin;
                if (yMaxInput) yMaxInput.value = globalMax;
                drawSingleSheetChart(data.sheetName, index);
            });
        }

        // --- 匯出帶有圖表之 Excel ---
        async function exportExcelWithCharts() {
            if (!consolidatedWorkbookBuffer) return;

            const exportBtn = document.getElementById('exportBtn');
            exportBtn.innerText = '⏳ 正在包裝圖表匯出中...';
            exportBtn.disabled = true;

            const wb = new ExcelJS.Workbook();
            await wb.xlsx.load(consolidatedWorkbookBuffer);

            chartInstances.forEach(item => {
                const worksheet = wb.getWorksheet(item.sheetName);
                if (!worksheet) return;

                const canvas = document.getElementById(item.canvasId);
                if (!canvas) return;

                const runCount = item.runCount || 1;
                const extraHeight = 50 + (Math.ceil(runCount / 3) * 35);

                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = canvas.width;
                exportCanvas.height = canvas.height + extraHeight;

                const ctx = exportCanvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
                ctx.drawImage(canvas, 0, 0);

                let startX = 50, startY = canvas.height + 25, colCount = 0;
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'left';

                item.chart.data.datasets.forEach((ds) => {
                    if (ds.isAvgLine) return;
                    drawMarkerShape(ctx, ds.pointStyle || 'circle', startX, startY - 4, 3.5, ds.borderColor);

                    ctx.fillStyle = '#333333';
                    ctx.fillText(ds.label, startX + 12, startY);
                    ctx.fillStyle = '#666666';
                    ctx.fillText(ds.avgValue !== null ? `Avg: ${ds.avgValue.toFixed(2)}` : 'Avg: N/A', startX + 12, startY + 16);

                    startX += 220;
                    colCount++;
                    if (colCount % 3 === 0) { startX = 50; startY += 40; }
                });

                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                ctx.strokeRect(1, 1, exportCanvas.width - 2, exportCanvas.height - 2);

                const imageId = wb.addImage({
                    base64: exportCanvas.toDataURL('image/png'),
                    extension: 'png',
                });

                let maxColNumber = 1;
                worksheet.eachRow({ includeEmpty: false }, (row) => {
                    if (row.actualCellCount > maxColNumber) maxColNumber = row.actualCellCount;
                });

                worksheet.addImage(imageId, {
                    tl: { col: maxColNumber + 2, row: 1 }, 
                    ext: { width: 720, height: 380 + (extraHeight * 0.8) }
                });
            });

            const buffer = await wb.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = exportFileName;
            link.click();
            URL.revokeObjectURL(link.href);

            exportBtn.innerText = '📥 下載整合好的完整 Excel (.xlsx)';
            exportBtn.disabled = false;
        }
    </script>
